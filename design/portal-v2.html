<meta charset="utf-8">
<title>SafeConnect</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap">
<style>
  /* Classy and cozy: warm white by day, near-black by night, 1px borders, one violet accent.
     Red only for 999 and danger, amber only for warnings, green only for "done". Monochrome icons in quiet tiles.
     One signature: the soft "signal ring". Same portal order as before: every service stays, no sign-in needed for help. */
  :root {
    --bg: #FBF8F4; --band: #F6F1EB; --surface: #FFFFFF; --surface-2: #F4EFE9; --line: rgba(40, 30, 20, 0.10); --line-2: rgba(40, 30, 20, 0.18);
    --ink: #1A1724; --ink-2: #4A4557; --muted: #645F70; --link: #4B37CF;
    --accent: #5B47E0; --accent-ink: #FFFFFF; --accent-soft: rgba(91, 71, 224, 0.09);
    --danger: #D7263D; --danger-ink: #FFFFFF; --danger-soft: rgba(215, 38, 61, 0.09);
    --warn: #8F5300; --warn-bg: #FBEBD3; --ok: #12804F; --ok-soft: rgba(18, 128, 79, 0.10);
    --shadow: 0 14px 40px rgba(60, 40, 20, 0.08); --glow: rgba(91, 71, 224, 0.10);
    --foot-bg: #F3EDE6;
    --font: "Manrope", "Noto Sans Bengali", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --r: 16px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0C0B11; --band: #100F17; --surface: #15141D; --surface-2: #1C1B26; --line: rgba(255, 255, 255, 0.08); --line-2: rgba(255, 255, 255, 0.15);
      --ink: #EFEDF6; --ink-2: #C3BFD3; --muted: #A4A0B8; --link: #B9AEFF;
      --accent: #A495FF; --accent-ink: #0C0B11; --accent-soft: rgba(164, 149, 255, 0.13);
      --danger: #FF5C6C; --danger-ink: #FFFFFF; --danger-soft: rgba(255, 92, 108, 0.12);
      --warn: #F2B65A; --warn-bg: rgba(242, 182, 90, 0.12); --ok: #5AD39A; --ok-soft: rgba(90, 211, 154, 0.12);
      --shadow: 0 18px 48px rgba(0, 0, 0, 0.45); --glow: rgba(164, 149, 255, 0.14);
      --foot-bg: #09080D;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0C0B11; --band: #100F17; --surface: #15141D; --surface-2: #1C1B26; --line: rgba(255, 255, 255, 0.08); --line-2: rgba(255, 255, 255, 0.15);
    --ink: #EFEDF6; --ink-2: #C3BFD3; --muted: #A4A0B8; --link: #B9AEFF;
    --accent: #A495FF; --accent-ink: #0C0B11; --accent-soft: rgba(164, 149, 255, 0.13);
    --danger: #FF5C6C; --danger-ink: #FFFFFF; --danger-soft: rgba(255, 92, 108, 0.12);
    --warn: #F2B65A; --warn-bg: rgba(242, 182, 90, 0.12); --ok: #5AD39A; --ok-soft: rgba(90, 211, 154, 0.12);
    --shadow: 0 18px 48px rgba(0, 0, 0, 0.45); --glow: rgba(164, 149, 255, 0.14);
    --foot-bg: #09080D;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16.5px; line-height: 1.65; -webkit-font-smoothing: antialiased; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
  .wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  a { color: var(--link); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 8px; }
  button, input, select, textarea { font: inherit; color: inherit; }
  h1, h2, h3 { margin: 0; line-height: 1.25; font-weight: 700; text-wrap: balance; }
  p { margin: 0; }
  .soft { color: var(--muted); }
  .glass { background: var(--surface); border: 1px solid var(--line); }
  .eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 0.84rem; font-weight: 600; color: var(--accent); }
  .eyebrow::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; box-shadow: 0 0 10px currentColor; flex: none; }
  .section { padding-block: 48px; border-top: 1px solid var(--line); }
  .section.tint { background: var(--band); }
  .section-title { display: grid; gap: 8px; margin-bottom: 26px; justify-items: start; }
  .section-title h2 { font-size: clamp(1.45rem, 3.6vw, 2rem); }
  .section-title p { color: var(--muted); max-width: 56ch; }
  .ico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); flex: none; }
  .ico svg { width: 19px; height: 19px; }
  .ico.acc { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
  .ico.red { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
  .demo-flag { font-size: 0.78rem; color: var(--warn); background: var(--warn-bg); border-radius: 999px; padding: 2px 10px; font-weight: 600; white-space: nowrap; }

  /* ---------- header: two rows ---------- */
  header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: color-mix(in srgb, var(--bg) 88%, transparent);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
  .topbar-in { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding-block: 10px; }
  .where { font-size: 0.85rem; color: var(--muted); font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .logo { display: flex; align-items: center; gap: 9px; background: none; border: 0; padding: 0; cursor: pointer; font-weight: 700; font-size: 1.15rem; color: var(--ink); justify-self: center; }
  .mark { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); flex: none; }
  .mark i { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  .top-actions { display: flex; gap: 6px; justify-content: flex-end; align-items: center; }
  .hpill { border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); padding: 6px 12px; font-weight: 600; font-size: 0.88rem; cursor: pointer; text-decoration: none; color: var(--ink);
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; min-height: 36px; }
  .hpill svg { width: 15px; height: 15px; flex: none; }
  .h999 { background: var(--danger); color: var(--danger-ink); border-color: transparent; font-weight: 700; }
  .acct .av { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font-size: 0.72rem; font-weight: 700; }
  .round { width: 36px; height: 36px; padding: 0; justify-content: center; }
  @media (max-width: 560px) { .topbar-in { grid-template-columns: auto 1fr; } .where { display: none; } .logo { justify-self: start; font-size: 1.02rem; } .hpill { padding: 6px 10px; } }
  @media (max-width: 430px) { .logo .logo-text { display: none; } }
  @media (max-width: 345px) { .acct .acct-text { display: none; } }
  .mainnav { border-top: 1px solid var(--line); }
  .nav { display: flex; gap: 2px; justify-content: center; overflow-x: auto; scrollbar-width: none; padding-block: 5px; }
  .nav::-webkit-scrollbar { display: none; }
  .nav button { flex: none; background: none; border: 0; border-radius: 999px; padding: 6px 13px; color: var(--muted); font-weight: 600; font-size: 0.9rem; cursor: pointer; white-space: nowrap; }
  .nav button:hover { background: var(--surface-2); color: var(--ink); }
  @media (max-width: 760px) { .nav { justify-content: flex-start; } }

  /* ---------- banner ---------- */
  .hero { padding-block: 26px 36px; background: radial-gradient(70% 60% at 85% 0%, var(--glow), transparent 70%); }
  .hero-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; align-items: center; }
  @media (min-width: 900px) { .hero-grid { grid-template-columns: 1.05fr 0.95fr; padding-block: 18px; } }
  .hero-text { display: grid; gap: 16px; min-width: 0; }
  .hero h1 { font-size: clamp(2rem, 5.6vw, 3.2rem); line-height: 1.18; letter-spacing: -0.005em; }
  .hero h1 .soft { display: block; font-size: 0.56em; margin-top: 8px; line-height: 1.45; font-weight: 600; }
  .lead { color: var(--ink-2); max-width: 50ch; }

  /* signature: signal ring */
  .signal { position: relative; border: 1px solid var(--line); border-radius: 24px; background: radial-gradient(120% 90% at 70% 20%, var(--accent-soft), transparent 60%), var(--surface);
    min-height: 360px; overflow: hidden; display: grid; place-items: center; box-shadow: var(--shadow); isolation: isolate; }
  @media (max-width: 899px) { .signal { display: none; } }
  .ring { position: absolute; width: 220px; height: 220px; border-radius: 50%; border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent);
    box-shadow: 0 0 60px color-mix(in srgb, var(--accent) 26%, transparent), inset 0 0 40px color-mix(in srgb, var(--accent) 16%, transparent); top: calc(50% - 150px); }
  .ring.r2 { width: 150px; height: 150px; opacity: 0.7; top: calc(50% - 115px); } .ring.r3 { width: 300px; height: 300px; opacity: 0.25; top: calc(50% - 190px); }
  .ring-dot { position: absolute; top: calc(50% - 47px); width: 14px; height: 14px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 6px var(--accent-soft), 0 0 30px var(--accent); z-index: 1; }
  @media (prefers-reduced-motion: no-preference) {
    .ring { animation: breathe 4.5s ease-in-out infinite; } .ring.r2 { animation-delay: -1.5s; } .ring.r3 { animation-delay: -3s; }
    @keyframes breathe { 50% { transform: scale(1.04); opacity: 0.55; } }
  }
  .float-card { position: absolute; left: 16px; right: 16px; bottom: 16px; border: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 90%, transparent);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-radius: 14px; padding: 12px 14px; display: grid; gap: 4px; z-index: 2; }
  .float-card small { color: var(--muted); font-size: 0.8rem; }
  .float-card b { font-weight: 600; }
  .order { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .order span { font-size: 0.8rem; border: 1px solid var(--line-2); border-radius: 999px; padding: 1px 10px; color: var(--ink-2); }
  .order span:first-child { border-color: color-mix(in srgb, var(--danger) 50%, transparent); color: var(--danger); }

  /* warm opening */
  .greet { display: inline-flex; align-items: center; gap: 9px; justify-self: start; font-weight: 600; font-size: 0.9rem; color: var(--ink-2);
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 14px 5px 12px; }
  .greet .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); flex: none; }
  .trust { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); font-size: 0.88rem; font-weight: 600; }
  .trust li::before { content: "✓ "; color: var(--ok); font-weight: 800; }
  .welcome { display: grid; gap: 10px; border-radius: var(--r); padding: 16px 18px; background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--accent); }
  .welcome h2 { font-size: 1.05rem; }
  .welcome ol { margin: 0; padding-left: 1.3em; display: grid; gap: 4px; color: var(--ink-2); font-size: 0.94rem; }
  .welcome .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .calm { color: var(--muted); font-size: 0.92rem; margin-top: -4px; }

  /* the three big actions */
  .actions { display: grid; gap: 10px; }
  .act { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 14px; text-align: left; width: 100%; border-radius: var(--r); padding: 12px 14px;
    cursor: pointer; text-decoration: none; color: var(--ink); transition: border-color .15s; }
  .act:hover { border-color: var(--accent); }
  .act > span:nth-child(2) { display: grid; min-width: 0; }
  .act strong { font-weight: 700; font-size: 1.08rem; line-height: 1.3; }
  .act small { color: var(--muted); font-size: 0.86rem; line-height: 1.45; }
  .tile { width: 50px; height: 50px; border-radius: 14px; display: grid; place-items: center; }
  .tile svg { width: 24px; height: 24px; }
  .arrow { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line); color: var(--muted); }
  .arrow svg { width: 15px; height: 15px; }
  .act.red { border-color: color-mix(in srgb, var(--danger) 45%, transparent); }
  .act.red strong { color: var(--danger); }
  .act.red .tile { background: var(--danger); color: var(--danger-ink); }
  .act.violet .tile { background: var(--accent); color: var(--accent-ink); }
  .act.amber .tile { background: var(--accent-soft); color: var(--accent); }
  .act[aria-busy="true"] { opacity: 0.7; cursor: progress; }
  .who-list { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
  .who-list span { background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 0 10px; font-size: 0.8rem; font-weight: 600; color: var(--ink); }

  /* ---------- national numbers row ---------- */
  .icons { padding-block: 22px; border-top: 1px solid var(--line); }
  .icon-row { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(100px, 1fr); gap: 0; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: thin;
    border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
  .icon-item { scroll-snap-align: start; display: grid; justify-items: center; gap: 6px; text-align: center; padding: 14px 6px; text-decoration: none; color: var(--ink);
    background: none; border: 0; border-right: 1px solid var(--line); cursor: pointer; }
  .icon-item:last-child { border-right: 0; }
  .icon-item:hover { background: var(--surface-2); }
  .icon-item .circle { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); }
  .icon-item .circle svg { width: 20px; height: 20px; }
  .icon-item b { font-size: 0.84rem; font-weight: 600; line-height: 1.3; }
  .icon-item small { font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .circle.c-red { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
  .circle.c-violet, .circle.c-amber { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

  /* ---------- search band ---------- */
  .search-band { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; align-items: center; }
  @media (min-width: 900px) { .search-band { grid-template-columns: 1.3fr 0.7fr; } }
  .search-band h2 { font-size: clamp(1.45rem, 3.6vw, 2rem); }
  .search-band .intro { display: grid; gap: 8px; margin-bottom: 16px; justify-items: start; }
  .search-band .intro p { color: var(--muted); }
  .find-art { display: none; justify-self: center; width: min(220px, 100%); max-width: 100%; }
  @media (min-width: 900px) { .find-art { display: block; } }
  .find-art .map { fill: var(--surface); stroke: var(--line-2); stroke-width: 1.5; } .find-art .road { stroke: var(--line-2); stroke-width: 5; fill: none; }
  .find-art .pin { fill: var(--accent); } .find-art .pin2 { fill: var(--danger); }
  .finder { position: relative; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .searchbar { display: flex; align-items: center; gap: 8px; border-radius: 14px; padding: 6px; background: var(--surface); border: 1px solid var(--line-2); }
  .searchbar:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .searchbar svg { width: 19px; height: 19px; flex: none; color: var(--muted); margin-left: 8px; }
  .searchbar input { flex: 1; min-width: 0; border: 0; background: none; padding: 10px 0; font-size: 1.05rem; outline: none; }
  .searchbar select { border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); color: var(--ink); padding: 9px 10px; font-weight: 600; font-size: 0.9rem; max-width: 44%; cursor: pointer; }
  .hint { color: var(--muted); font-size: 0.9rem; }
  .suggest { list-style: none; margin: 0; padding: 6px; display: grid; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
  .suggest button { width: 100%; text-align: left; background: none; border: 0; border-radius: 10px; padding: 10px 12px; cursor: pointer; display: grid; color: var(--ink); }
  .suggest button:hover, .suggest button:focus-visible { background: var(--surface-2); }
  .suggest b { font-weight: 600; } .suggest span { color: var(--muted); font-size: 0.88rem; }
  .none { padding: 10px 12px; color: var(--muted); font-size: 0.92rem; }
  .suggest .group { padding: 8px 12px 2px; font-size: 0.8rem; font-weight: 700; color: var(--accent); }
  .fallback-box { display: grid; gap: 10px; padding: 10px 12px 12px; border-top: 1px solid var(--line); margin-top: 4px; }
  .fallback-box p { font-size: 0.92rem; font-weight: 600; }
  .suggest .fallback-box .chip, .suggest .fallback-box .btn { width: auto; display: inline-flex; border-radius: 999px; }
  .suggest .fallback-box .chip { font-size: 0.88rem; padding: 4px 12px; background: var(--surface-2); }
  .suggest .fallback-box .btn { padding: 8px 16px; }
  .suggest .fallback-box .btn.violet { background: var(--accent); color: var(--accent-ink); }
  .recent { justify-self: start; }
  .msg { font-weight: 600; padding: 12px 16px; border-radius: 12px; background: var(--warn-bg); color: var(--warn); }
  .msg.plain { background: var(--surface); color: var(--ink); font-weight: 500; border: 1px solid var(--line); }
  .demo { display: grid; gap: 8px; border: 1px dashed var(--line-2); border-radius: 12px; padding: 12px 14px; background: var(--surface); }
  .demo p { color: var(--muted); font-size: 0.88rem; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: 0.95rem; color: var(--ink); }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
  .home-msgs { display: grid; gap: 12px; }
  .home-msgs:empty { display: none; }

  /* ---------- situation cards ---------- */
  .grid-3 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; display: grid; grid-template-rows: auto 1fr; min-width: 0; transition: border-color .15s; }
  .card:hover { border-color: var(--line-2); }
  .card .art { position: relative; height: 96px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px;
    background: radial-gradient(80% 120% at 100% 0%, var(--glow), transparent 70%), var(--surface); border-bottom: 1px solid var(--line); }
  .card .art .num { font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; }
  .card .body { padding: 16px 18px 18px; display: grid; gap: 8px; align-content: start; }
  .card h3 { font-size: 1.08rem; }
  .card p { color: var(--muted); font-size: 0.95rem; }
  .card .btn-primary { margin-top: 6px; }
  .btn-primary { justify-self: start; display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 700; cursor: pointer; text-decoration: none;
    background: var(--accent); color: var(--accent-ink); }
  .btn-primary svg { width: 15px; height: 15px; }

  /* known places */
  .places { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  @media (min-width: 900px) { .places { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .place { position: relative; display: grid; gap: 14px; align-content: space-between; min-height: 132px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface);
    cursor: pointer; padding: 14px; text-align: left; color: var(--ink); min-width: 0; transition: border-color .15s; }
  .place:hover { border-color: var(--accent); }
  .place .ico { width: 36px; height: 36px; }
  .place .label { display: grid; gap: 2px; min-width: 0; }
  .place .label b { font-weight: 600; font-size: 1rem; overflow-wrap: anywhere; }
  .place .label small { font-size: 0.82rem; color: var(--muted); }
  .place .corner { position: absolute; top: 14px; right: 14px; color: var(--muted); }
  .place .corner svg { width: 15px; height: 15px; }

  /* stats strip */
  .stats { border-radius: var(--r); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 6px; margin-top: 16px; }
  @media (min-width: 760px) { .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .stat { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; align-items: center; padding: 12px; min-width: 0; }
  .stat .ic { grid-row: span 2; width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-2); }
  .stat .ic svg { width: 18px; height: 18px; }

const digits = (s) => (lang === 'bn' ? String(s).replace(/\d/g, (d) => '০১২৩৪৫৬৭৮৯'[d]) : String(s));
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const withPhone = (r) => r.phones && r.phones.length > 0;
const fmtDate = (iso) => { try { return new Intl.DateTimeFormat(lang === 'bn' ? 'bn-BD' : 'en-GB', { day: 'numeric', month: 'short', year: 'numeric' }).format(new Date(iso)); } catch { return iso; } };

/* ---------- names ---------- */
const districtOf = (key) => DISTRICTS.find((d) => d.key === key);
function upazilaName(dkey, en) {
  const u = upazilas(data.docs[dkey]).find((x) => x.en === en);
  return lang === 'bn' && u ? u.bn : en;
}
function areaName(a) {
  if (!a) return '';
  if (lang === 'en' && a.en) return a.en;
  return a.type === 'municipality' ? a.bn.split(/[,،]/)[0].trim() : a.bn;
}
function placeTitle(p) {
  if (p.label) return p.label;
  return p.area ? areaName(p.area) : `${upazilaName(p.district, p.upazila)} (${t().wholeUpazila})`;
}
function placeSub(p) {
  const d = districtOf(p.district);
  const parts = p.area ? [upazilaName(p.district, p.upazila)] : [];
  parts.push(lang === 'bn' ? d.bn : d.en);
  return parts.join(', ');
}

/* ---------- area search: any spelling, Bangla or English, never a dead end ---------- */
// Sound key: Bangla and typed English both become a consonant skeleton, so
// "hasanhat", "hason haat" and "হাসান হাট" all become "hsnht".
const BN_LAT = { 'ক': 'k', 'খ': 'k', 'গ': 'g', 'ঘ': 'g', 'ঙ': 'ng', 'চ': 'c', 'ছ': 's', 'জ': 'j', 'ঝ': 'j', 'ঞ': 'n', 'ট': 't', 'ঠ': 't',
  'ড': 'd', 'ঢ': 'd', 'ণ': 'n', 'ত': 't', 'থ': 't', 'দ': 'd', 'ধ': 'd', 'ন': 'n', 'প': 'p', 'ফ': 'f', 'ব': 'b', 'ভ': 'b', 'ম': 'm',
  'য': 'j', 'র': 'r', 'ল': 'l', 'শ': 's', 'ষ': 's', 'স': 's', 'হ': 'h', 'ড়': 'r', 'ঢ়': 'r', 'ৎ': 't', 'ং': 'ng', 'ক্ষ': 'k' };
const GENERIC = /(ইউনিয়ন|পৌরসভা|পৌর|উপজেলা|জেলা|গ্রাম|\bunion\b|\bup\b|pourashava|paurashava|pourasava|municipality|upazila|upozila|\bzila\b|\bdistrict\b|\bgram\b|\bvillage\b|\btown\b)/gi;
function wordKey(w) {
  const lead = /^[aeiouঅ-ঔ]/.test(w) ? '@' : '';   // a word that starts with a vowel keeps a marker: "inani", "enani", "ইনানী" -> "@n"
  let s = w.replace(/য়/g, '').replace(/[ডঢ]়/g, 'র');   // য় is a vowel sound; ড়/ঢ় sound like র
  s = s.replace(/[ঀ-৿]/g, (ch) => BN_LAT[ch] ?? '');
  s = s.replace(/c(?=[aou])/g, 'k');           // English "cox": c before a/o/u sounds like k
  s = s.replace(/ch/g, 'c').replace(/sh/g, 's').replace(/kh/g, 'k').replace(/gh/g, 'g').replace(/th/g, 't').replace(/dh/g, 'd')
    .replace(/bh/g, 'b').replace(/ph/g, 'f').replace(/x/g, 'ks').replace(/z/g, 'j').replace(/q/g, 'k').replace(/v/g, 'b');
  s = s.replace(/[^a-z]/g, '').replace(/[aeiouwy]/g, '');
  return lead + s.replace(/(.)\1+/g, '$1');     // "kks" -> "ks"
}
function soundKey(text) {
  return norm(text).toLowerCase().replace(GENERIC, ' ').split(/[\s,.'’\-]+/).filter(Boolean).map(wordKey).join('');
}
function editDistance(a, b) {
  if (Math.abs(a.length - b.length) > 3) return 9;
  const prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    let diag = prev[0]; prev[0] = i;
    for (let j = 1; j <= b.length; j++) {
      const tmp = prev[j];
      prev[j] = Math.min(prev[j] + 1, prev[j - 1] + 1, diag + (a[i - 1] === b[j - 1] ? 0 : 1));
      diag = tmp;
    }
  }
  return prev[b.length];
}
function addItem(item, names) {
  item.words = norm(names.join(' ')).toLowerCase();
  const parts = names.flatMap((n) => [n, ...norm(n).split(/\s+/)]);
  item.keys = [...new Set(parts.map(soundKey).filter((k) => k.length >= 2))];
  areaIndex.push(item);
}
function buildIndex() {
  areaIndex = [];
  for (const d of DISTRICTS) {
    const doc = data.docs[d.key];
    if (!doc) continue;
    for (const u of upazilas(doc)) {
      addItem({ kind: 'upazila', place: { district: d.key, upazila: u.en, area: null } }, [u.bn, u.en]);
      for (const a of localAreas(doc, u.en)) addItem({ kind: a.type, place: { district: d.key, upazila: u.en, area: a } }, [a.bn.split(/[,،]/)[0], a.en || '']);
    }
    for (const p of doc.places || []) {
      const upz = upazilas(doc).find((u) => norm(u.bn) === norm(p.upazila_bn));
      if (upz) addItem({ kind: 'place', place: { district: d.key, upazila: upz.en, area: { type: 'union', bn: norm(p.union_bn) }, placeId: p.id }, named: p }, [p.name_bn, p.name_en]);
    }
    for (const v of doc.villages || []) {
      if (/ওয়ার্ড|ওয়ার্ড|\d|[০-৯]/.test(norm(v.village_bn))) continue;
      const upz = upazilas(doc).find((u) => norm(u.bn) === norm(v.upazila_bn));
      const area = upz && localAreas(doc, upz.en).find((a) => a.type === 'union' && a.bn === norm(v.union_bn));
      if (area) addItem({ kind: 'village', village: norm(v.village_bn), place: { district: d.key, upazila: upz.en, area } }, [v.village_bn]);
    }
  }
}
// Lower score = better. 0-2 text match, 3 same sound, 4 sound starts the same: these are real matches.
// 5+ is only a close spelling: shown under "Did you mean", never as if it were the place.
function scoreItem(item, s, key) {
  const w = item.words.split(/\s+/);
  if (w.some((x) => x === s)) return 0;
  if (w.some((x) => x.startsWith(s))) return 1;
  if (item.words.includes(s)) return 2;
  if (key.length < 2) return null;
  let best = null;
  for (const k of item.keys) {
    let sc = null;
    if (k === key) sc = key.replace('@', '').length >= 4 ? 3 : 5;   // short names sound alike too easily: only "similar"
    else if (key.length >= 4 && k.startsWith(key)) sc = 4;
    else if (key.length >= 3) {
      const d = editDistance(key, k);
      if (d <= Math.max(1, Math.floor(key.length / 3))) sc = 5 + d;
    }
    if (sc != null) best = Math.min(best ?? 99, sc);
  }
  return best;
}
const KIND_ORDER = { municipality: 0, place: 1, union: 2, village: 3, upazila: 4 };
function findAreas(q) {
  const s = norm(q).toLowerCase().trim();
  if (s.length < 2) return { hits: [], close: [] };
  const key = soundKey(s);
  const only = $('distSel').value;
  const out = [];
  for (const item of areaIndex) {
    if (only && item.place.district !== only) continue;
    const sc = scoreItem(item, s, key);
    if (sc != null) out.push({ item, sc });
  }
  out.sort((a, b) => a.sc - b.sc || KIND_ORDER[a.item.kind] - KIND_ORDER[b.item.kind]);
  const seen = new Set();
  const uniq = out.filter(({ item }) => { const k = `${item.kind}|${item.village || ''}|${item.place.district}|${item.place.upazila}|${item.place.area?.bn || ''}`; if (seen.has(k)) return false; seen.add(k); return true; });
  return { hits: uniq.filter((x) => x.sc <= 4).slice(0, 8).map((x) => x.item), close: uniq.filter((x) => x.sc > 4).slice(0, 3).map((x) => x.item) };
}
function itemLabel(h) {
  const p = { ...h.place };
  if (h.named) p.label = lang === 'bn' ? h.named.name_bn : h.named.name_en;
  const kindWord = t().kinds[h.kind] || '';
  let title;
  if (h.kind === 'village') title = h.village;
  else if (h.place.area) title = p.label || areaName(h.place.area);
  else title = upazilaName(p.district, p.upazila);
  const sub = h.kind === 'village' ? `${areaName(h.place.area)}, ${placeSub(p)}` : placeSub(p);
  return { p, title: `${title} (${kindWord})`, sub };
}
function suggestButton(h) {
  const li = el('li');
  const b = el('button'); b.type = 'button';
  const { p, title, sub } = itemLabel(h);
  b.append(el('b', null, title), el('span', null, sub));
  b.addEventListener('click', () => openArea(p, null));
  li.append(b);
  return li;
}
function renderSuggest() {
  const q = $('areaInput').value;
  const box = $('suggest');
  if (norm(q).length < 2) { box.hidden = true; return; }
  const { hits, close } = findAreas(q);
  if (hits.length) { box.replaceChildren(...hits.map(suggestButton)); box.hidden = false; return; }
  // Never a dead end: close spellings, then the upazila list, then GPS and 999.
  const s = t();
  const parts = [el('li', 'none', close.length ? s.noExact : s.noMatch)];
  if (close.length) { parts.push(el('li', 'group', s.didYouMean)); close.forEach((h) => parts.push(suggestButton(h))); }
  const ups = el('li', 'fallback-box');
  ups.append(el('p', null, s.pickUpazila));
  const chips = el('div', 'chips');
  const only = $('distSel').value;
  for (const d of DISTRICTS) {
    if (only && d.key !== only) continue;
    const doc = data.docs[d.key]; if (!doc) continue;
    for (const u of upazilas(doc)) {
      const c = el('button', 'chip', lang === 'bn' ? u.bn : u.en); c.type = 'button';
      c.addEventListener('click', () => openArea({ district: d.key, upazila: u.en, area: null }, null));
      chips.append(c);
    }
  }
  ups.append(chips);
  const row = el('div', 'tools');
  const gps = el('button', 'btn violet', s.locate); gps.type = 'button'; gps.addEventListener('click', locate);
  const call = el('a', 'btn', s.call999); call.href = 'tel:999';
  row.append(gps, call);
  ups.append(row, el('p', 'privacy', s.tellUs));
  parts.push(ups);
  box.replaceChildren(...parts);
  box.hidden = false;
}

/* ---------- contacts ---------- */
function callLink(num, label, red = false) {
  const a = el('a', `call${red ? ' red' : ''}`);
  a.href = `tel:${num}`;
  a.append(el('small', null, label), document.createTextNode(digits(num)));
  return a;
}
function personRow(r) {
  const row = el('div', 'person');
  const info = el('div');
  const nm = r.kind === 'national' && lang === 'en' ? r.name_en : r.name_bn;
  info.append(el('span', 'name', nm || r.designation_bn));
  const role = [r.designation_bn !== nm ? r.designation_bn : '', r.office_bn].filter(Boolean).join(' · ');
  if (role && r.kind !== 'national') info.append(el('span', 'role', role));
  const tags = el('div', 'tags');
  if (r.ward_no) tags.append(el('span', 'tag', `${t().ward} ${digits(r.ward_no)}`));
  for (const f of r.flags || []) if (t().flags[f]) tags.append(el('span', 'tag warn', t().flags[f]));
  if (tags.children.length) info.append(tags);
  row.append(info);
  const calls = el('div', 'calls');
  (r.phones || []).slice(0, 2).forEach((p) => calls.append(callLink(p, t().call)));
  row.append(calls);
  if (r.source_url) {
    const src = el('p', 'src');
    const a = el('a', null, `${t().source} ↗`); a.href = r.source_url; a.target = '_blank'; a.rel = 'noopener';
    src.append(a, ` · ${t().checked} ${fmtDate(r.script_check?.on || r.checked_on || r.retrieved_on)}`);
    row.append(src);
  }
  return row;
}
function firstRow(what, r, red = false) {
  const row = el('div', 'first-row glass');
  const info = el('div');
  info.append(el('span', 'what', what));
  const who = r.kind === 'national' ? (lang === 'en' ? r.name_en : r.name_bn) : [r.name_bn, r.designation_bn].filter(Boolean).join(', ');
  info.append(el('span', 'who', who));
  row.append(info, callLink(r.phones[0], t().call, red));
  return row;
}

function renderArea() {
  const p = current.place;
  const groups = p.outside ? null : areaContacts(data, p);
  $('youAreIn').textContent = p.outside ? t().outsideTitle : t().youAreIn;
  $('placeName').textContent = p.outside ? `${digits(current.pos.lat.toFixed(4))}, ${digits(current.pos.lon.toFixed(4))}` : placeTitle(p);
  $('placeSub').textContent = p.outside ? '' : placeSub(p);
  $('outside').hidden = !p.outside;
  $('outside').textContent = t().outside;

  const note = p.placeId && data.docs[p.district].places.find((x) => x.id === p.placeId);
  $('placeNote').hidden = !note;
  if (note) $('placeNote').textContent = note.how_to_report_bn;

  // share
  $('share').hidden = !current.pos;
  if (current.pos) {
    const link = mapsLink(current.pos);
    const msg = t().shareMsg(link);
    const wa = el('a', 'btn', 'WhatsApp'); wa.href = `https://wa.me/?text=${encodeURIComponent(msg)}`; wa.target = '_blank'; wa.rel = 'noopener';
    const sms = el('a', 'btn', 'SMS'); sms.href = `sms:?&body=${encodeURIComponent(msg)}`;
    const map = el('a', 'btn', t().map); map.href = link; map.target = '_blank'; map.rel = 'noopener';
    const copy = el('button', 'btn', t().copy); copy.type = 'button';
    copy.addEventListener('click', () => navigator.clipboard?.writeText(msg).then(() => { copy.textContent = t().copied; }, () => {}));
    const fam = el('button', 'btn violet', t().sendFamily); fam.type = 'button';
    fam.addEventListener('click', () => openSos(current.pos));
    $('shareBtns').replaceChildren(fam, wa, sms, copy, map);
  }

  // call these first
  const first = $('firstList');
  first.replaceChildren();
  const nat = (id) => data.national.find((n) => n.id === id);
  first.append(firstRow(t().what.emergency, nat('national-emergency-999'), true));
  if (groups) {
    const g = (id) => groups.find((x) => x.id === id);
    const pick = (id) => (g(id)?.items || []).find((r) => withPhone(r) && r.kind !== 'national');
    const police = pick('police');
    if (police) first.append(firstRow(t().what.police, police));
    if (p.area && pick('tourist_police') && p.district === 'coxsbazar') first.append(firstRow(t().what.tourist_police, nat('tourist-police-helpline')));
    const local = p.area?.type === 'municipality' ? pick('town') : pick('local');
    if (local) first.append(firstRow(p.area?.type === 'municipality' ? t().what.town : t().what.local, local));
    else { const uno = pick('administration'); if (uno) first.append(firstRow(t().what.administration, uno)); }
  }

  // more help
  const more = $('moreList');
  more.replaceChildren();
  const list = groups
    ? groups.filter((gr) => gr.id !== 'emergency')
    : [{ id: 'helplines', items: NATIONAL_EVERYWHERE.slice(1).map(nat).filter(Boolean) }];
  for (const gr of list) {
    const items = gr.items;
    const callable = items.filter(withPhone).length;
    const d = el('details', 'cat');
    const s = el('summary');
    s.append(el('span', null, t().groups[gr.id] || gr.id), el('span', 'count', digits(callable)));
    d.append(s);
    const body = el('div', 'cat-body');
    if (gr.fallback) body.append(el('p', 'fallback', t().fallback));
    if (gr.noNumbers) body.append(el('p', 'fallback', t().noNumbers));
    const sorted = [...items].sort((a, b) => withPhone(b) - withPhone(a));
    sorted.forEach((r, i) => { const row = personRow(r); if (i >= VISIBLE) row.hidden = true; body.append(row); });
    if (sorted.length > VISIBLE) {
      const b = el('button', 'btn showall', t().showAll(digits(sorted.length))); b.type = 'button';
      b.addEventListener('click', () => { body.querySelectorAll('.person[hidden]').forEach((x) => { x.hidden = false; }); b.remove(); });
      body.append(b);
    }
    d.append(body);
    more.append(d);
  }
  if (!groups) more.firstChild.open = true;
}

/* ---------- views ---------- */
function showView(name) {
  for (const v of ['home', 'area', 'sos', 'signin', 'ws']) $(v).hidden = name !== v;
  window.scrollTo(0, 0);
}
function openArea(place, pos) {
  current = { place, pos };
  if (!place.outside) store.set('sc-last', JSON.stringify(place));
  renderArea();
  showView('area');
}
function goHome() {
  $('areaInput').value = '';
  $('suggest').hidden = true;
  renderRecent();
  showView('home');
}
function renderRecent() {
  let last = null;
  try { last = JSON.parse(store.get('sc-last') || 'null'); } catch {}
  const b = $('recentBtn');
  if (!last || !data.docs[last.district]) { b.hidden = true; return; }
  b.textContent = t().recent(placeTitle(last));
  b.onclick = () => openArea(last, null);
  b.hidden = false;
}

/* ---------- location ---------- */
function msg(text) { $('locMsg').textContent = text; $('locMsg').hidden = !text; }
function resolvePlace(pos) {
  const found = locations && nearestPlace(locations, pos);
  if (!found) return { outside: true };
  const place = { district: found.district, upazila: found.upazila, area: found.area };
  const doc = data.docs[found.district];
  const named = found.area && (doc.places || []).find((x) => norm(x.union_bn) === found.area.bn);
  if (named) place.placeId = named.id;
  if (found.area) {
    const full = localAreas(doc, found.upazila).find((a) => a.type === found.area.type && a.bn === found.area.bn);
    if (full) place.area = full;
  }
  return place;
}
function applyPosition(pos) { lastFix = { pos, at: Date.now() }; openArea(resolvePlace(pos), pos); }
function demoPicks() {
  if (!locations) return [];
  const picks = [
    [locations.municipalities.find((m) => m.municipality_bn.includes('চৌমুহনী')), { bn: 'চৌমুহনী', en: 'Chowmuhani' }],
    [locations.unions.find((u) => u.union_en === 'Jaliapalong'), { bn: 'ইনানী সৈকত', en: 'Inani beach' }],
    [locations.unions.find((u) => u.district === 'Noakhali' && u.upazila_en === 'Hatiya'), { bn: 'হাতিয়া', en: 'Hatiya' }],
    [{ lat: 23.8103, lon: 90.4125 }, { bn: 'ঢাকা (জেলার বাইরে)', en: 'Dhaka (outside)' }],
  ].filter(([p]) => p);
  return picks;
}
function fillDemo(box, textEl, chipsEl, onPick) {
  if (!locations) return;
  textEl.textContent = t().demo;
  chipsEl.replaceChildren(...demoPicks().map(([p, name]) => {
    const b = el('button', 'chip', name[lang]); b.type = 'button';
    b.addEventListener('click', () => onPick({ lat: p.lat + 0.004, lon: p.lon - 0.003, accuracy: 20 }));
    return b;
  }));
  box.hidden = false;
}
function showDemo() { fillDemo($('demo'), $('demoText'), $('demoChips'), applyPosition); }
async function locate() {
  const btn = $('locateBtn');
  btn.setAttribute('aria-busy', 'true');
  msg(t().locating);
  try {
    const pos = await getPosition();
    msg('');
    applyPosition(pos);
  } catch (err) {
    msg(t()[err.code] || t().unavailable);
    showDemo();
  } finally {
    btn.removeAttribute('aria-busy');
  }
}

/* ---------- send location to family (no login) ---------- */
let lastFix = null;          // { pos, at }
let sos = { situation: 'danger', pos: null, place: null, state: 'idle', edited: false };
const toAscii = (s) => String(s).replace(/[০-৯]/g, (d) => '০১২৩৪৫৬৭৮৯'.indexOf(d));
function normPhone(raw) {
  let d = toAscii(raw).replace(/\D/g, '');
  if (d.startsWith('880')) d = d.slice(2);
  else if (d.startsWith('88') && d.length === 13) d = d.slice(2);
  return /^01[3-9]\d{8}$/.test(d) ? d : null;
}
function getPeople() { try { return JSON.parse(store.get('sc-family') || '[]').filter((p) => p && normPhone(p.phone)); } catch { return []; } }
function setPeople(list) { store.set('sc-family', JSON.stringify(list)); }

function renderHomeSos() {
  const people = getPeople();
  const sub = $('sosBtnSub');
  sub.replaceChildren();
  if (!people.length) { sub.textContent = t().sosBtnSubNone; return; }
  sub.textContent = t().sosBtnSub;
  const chips = el('span', 'who-list');
  people.forEach((p) => chips.append(el('span', null, p.rel || p.name)));
  sub.append(chips);
}

function sosMessage() {
  const s = t();
  const lines = [`${s.urgent} ${s.sits[sos.situation][1]}`];
  if (sos.place && !sos.place.outside) lines.push(s.area(`${placeTitle(sos.place)}, ${placeSub(sos.place)}`));
  lines.push(sos.pos ? s.mapLine(mapsLink(sos.pos)) : s.noLoc);
  const time = new Intl.DateTimeFormat(lang === 'bn' ? 'bn-BD' : 'en-GB', { hour: 'numeric', minute: '2-digit' }).format(new Date());
  lines.push(`${s.timeLine(time)} ${s.sign}`);
  return lines.join('\n');
}
function refreshMessage() { if (!sos.edited) $('sosMsg').value = sosMessage(); renderSend(); }

function renderSituations() {
  $('situations').replaceChildren(...Object.entries(t().sits).map(([k, [label]]) => {
    const b = el('button', 'chip', label); b.type = 'button';
    b.setAttribute('aria-pressed', String(k === sos.situation));
    b.addEventListener('click', () => { sos.situation = k; sos.edited = false; renderSituations(); refreshMessage(); });
    return b;
  }));
}
function renderLoc() {
  const line = $('sosLoc');
  line.className = 'locline';
  if (sos.state === 'getting') line.textContent = t().gettingLoc;
  else if (sos.pos && sos.place && !sos.place.outside) {
    line.classList.add('ok');

function renderWarm() {
  const h = new Date().getHours();
  const part = h >= 21 || h < 5 ? 'night' : h < 12 ? 'morning' : h < 17 ? 'noon' : 'evening';
  const g = $('greet');
  const dot = el('span', 'dot');
  dot.setAttribute('aria-hidden', 'true');
  g.replaceChildren(dot, document.createTextNode(part === 'night' ? M().greet.night : `${M().greet[part]}! ${M().greetTail}`));
  $('trust').replaceChildren(...M().trust.map((x) => el('li', null, x)));
  let seen = false;
  try { seen = localStorage.getItem('sc-welcomed') === '1'; } catch {}
  const w = $('welcome');
  w.hidden = seen;
  if (seen) return;
  const ok = el('button', 'btn', M().welcomeOk); ok.type = 'button';
  ok.addEventListener('click', () => { try { localStorage.setItem('sc-welcomed', '1'); } catch {} w.hidden = true; });
  const save = el('button', 'btn violet', M().welcomeSave); save.type = 'button';
  save.addEventListener('click', () => { try { localStorage.setItem('sc-welcomed', '1'); } catch {} w.hidden = true; saveNumbers(); });
  const ol = el('ol'); M().welcomeSteps.forEach((x) => ol.append(el('li', null, x)));
  const row = el('div', 'row'); row.append(save, ok);
  const title = el('h2', null, M().welcomeTitle); title.id = 'welcomeTitle';
  w.replaceChildren(title, ol, row);
}

function openSignin(role) {

  pickRole = ROLES.includes(role) ? role : pickRole;
  renderSignin(); showView('signin');
}

  const call = el('a', 'btn danger', t().call999); call.href = 'tel:999';
  const send = el('button', 'btn', t().sosBtn); send.type = 'button'; send.addEventListener('click', () => openSos(null));
  const near = el('button', 'btn', t().locate); near.type = 'button'; near.addEventListener('click', () => { goHome(); locate(); });

    const b = el('button', 'btn sm', L('সাধারণ ব্যবহারকারী হিসেবে ঢুকুন', 'Sign in as a general user')); b.type = 'button';
    b.addEventListener('click', () => { pickRole = 'user'; renderSignin(); });

    document.createTextNode(L('আসল সাইন ইন পরের ধাপে (P17) যুক্ত হবে। এখন "সাইন ইন" চাপলে উদাহরণ তথ্যসহ ওয়ার্কস্পেস খুলবে। কোনো তথ্য কোথাও পাঠানো হয় না।',
      'Real sign-in is added in the next step (P17). For now, "Sign in" opens a workspace with example data. Nothing is sent anywhere.')));
}

function signIn(role) {
  session = { role };
  store.set('sc-demo-session', JSON.stringify(session));
  $('siPass').value = '';
  renderAccount();
  openWorkspace(role);
}
function signOut() {
  session = null;

  renderAccount(); goHome();
  toast(L('সাইন আউট হয়েছে। ৯৯৯, লোকেশন পাঠানো আর কাছের সাহায্য আগের মতোই চালু।', 'Signed out. 999, send location and help near me still work as before.'));

  const navBtn = ([k, label, icon]) => `<button class="navitem" type="button" data-page="${k}"${k === wsPage ? ' aria-current="page"' : ''}>${ic(icon)}${esc(label)}</button>`;
  const urgent = `<div class="navgroup"><small>${esc(L('জরুরি (সাইন ইন ছাড়াও চলে)', 'Emergency (works signed out too)'))}</small>

  $('wsSide').innerHTML = `<div class="me"><span class="avatar">${esc(me.init)}</span><div><b>${esc(me.name)}</b><small>${esc(rt.name)}</small></div></div>`

  $('wsMob').innerHTML = navItems().flatMap(([, items]) => items).map(navBtn).join('');

function familyRows() {
  const people = getPeople();
  if (!people.length) return `<div class="wempty">${esc(t().noPeople)}<button class="btn primary sm" type="button" data-act="save">${esc(t().ctaBtn)}</button></div>`;
  return people.map((p) => `<div class="wrow"><span class="avatar">${esc((p.name || '?').trim().charAt(0).toUpperCase())}</span><div><b>${esc(p.name)}${p.rel ? ` <span class="soft" style="font-weight:400">(${esc(p.rel)})</span>` : ''}</b><small>${esc(digits(p.phone))}</small></div>

}

function wsClick(e) {
  const b = e.target.closest('[data-page],[data-rstep],[data-astep],[data-signout],[data-quick],[data-act],.chip');
  if (!b) return;
  if (b.dataset.page) { wsPage = b.dataset.page; if (wsPage === 'newreport') rStep = 0; if (wsPage === 'apply') aStep = 0; renderWS(); window.scrollTo(0, 0); }
  else if (b.dataset.rstep) { rStep = Number(b.dataset.rstep); renderWS(); }
  else if (b.dataset.astep) { aStep = Number(b.dataset.astep); renderWS(); }
  else if (b.hasAttribute('data-signout')) signOut();
  else if (b.dataset.quick) openQuick(b.dataset.quick);
  else if (b.dataset.act === 'sos') openSos(null);
  else if (b.dataset.act === 'near') { goHome(); locate(); }
  else if (b.dataset.act === 'save') saveNumbers();
  else if (b.dataset.act === 'lang') $('langBtn').click();
  else if (b.classList.contains('chip')) b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
}
$('ws').addEventListener('click', wsClick);
