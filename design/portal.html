<meta charset="utf-8">
<title>SafeConnect</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap">
<style>
  /* Layout: a familiar telecom-portal order (two-row header, banner, round icon row, search band, card grids,
     help icons, feature band, column footer) in SafeConnect's own violet-dusk colours.
     Night = deep indigo with a dusk banner; day = lavender-white with a dawn banner. */
  :root {
    --bg: #FFFAF6; --band: #FBF0F4; --surface: #FFFFFF; --surface-2: #F7F1FA; --line: rgba(90, 60, 180, 0.15);
    --ink: #1C1442; --muted: #574E7E; --accent: #6B3FE0; --accent-ink: #FFFFFF; --link: #5A2FD6;
    --title-2: #6B3FE0; --title-3: #C0408C;
    --sky-1: #DCD0FF; --sky-2: #F0E0FF; --sky-3: #FFDCE6; --sky-4: #FFCFA8; --hill-1: #CDB8F5; --hill-2: #B194EC; --water: #E7DCFF;
    --stars: 0; --orb-1: #FFF8E1; --orb-2: #FFB86B;
    --red-1: #F2385E; --red-2: #C0123A; --amber-1: #FFC94D; --amber-2: #FF8F3F; --amber-ink: #2A1500;
    --violet-1: #8457FF; --violet-2: #5427D6; --on-color: #FFFFFF;
    --warn: #8A4B00; --warn-bg: #FFEBD2; --ok: #12804C;
    --shadow: 0 6px 24px rgba(80, 50, 160, 0.10);
    --foot-bg: #F2EEFA; --foot-ink: #1C1442; --foot-muted: #574E7E; --foot-line: rgba(90, 60, 180, 0.15);
    --font: "Manrope", "Noto Sans Bengali", system-ui, -apple-system, "Segoe UI", sans-serif;
    --r: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0D0A24; --band: #140F36; --surface: #1B1546; --surface-2: #241C56; --line: rgba(255, 255, 255, 0.12);
      --ink: #F4F0FF; --muted: #BDB3E0; --accent: #9D72FF; --accent-ink: #FFFFFF; --link: #C7A9FF;
      --title-2: #D9BCFF; --title-3: #A98BFF;
      --sky-1: #160F3A; --sky-2: #34206C; --sky-3: #84489C; --sky-4: #F09A78; --hill-1: #2B1C58; --hill-2: #1B1240; --water: #1B1446;
      --stars: 1; --orb-1: #F3EEFF; --orb-2: #8D6BFF;
      --red-1: #FF4D6D; --red-2: #D61F45; --amber-1: #FFCB5C; --amber-2: #FF9548;
      --violet-1: #9D72FF; --violet-2: #6435F0;
      --warn: #FFC98A; --warn-bg: rgba(255, 170, 80, 0.14); --ok: #6EE7A8;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      --foot-bg: #0A0820; --foot-ink: #F3EFFF; --foot-muted: #A9A0CC; --foot-line: rgba(255, 255, 255, 0.10);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0D0A24; --band: #140F36; --surface: #1B1546; --surface-2: #241C56; --line: rgba(255, 255, 255, 0.12);
    --ink: #F4F0FF; --muted: #BDB3E0; --accent: #9D72FF; --accent-ink: #FFFFFF; --link: #C7A9FF;
    --title-2: #D9BCFF; --title-3: #A98BFF;
    --sky-1: #160F3A; --sky-2: #34206C; --sky-3: #84489C; --sky-4: #F09A78; --hill-1: #2B1C58; --hill-2: #1B1240; --water: #1B1446;
    --stars: 1; --orb-1: #F3EEFF; --orb-2: #8D6BFF;
    --red-1: #FF4D6D; --red-2: #D61F45; --amber-1: #FFCB5C; --amber-2: #FF9548;
    --violet-1: #9D72FF; --violet-2: #6435F0;
    --warn: #FFC98A; --warn-bg: rgba(255, 170, 80, 0.14); --ok: #6EE7A8;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    --foot-bg: #0A0820; --foot-ink: #F3EFFF; --foot-muted: #A9A0CC; --foot-line: rgba(255, 255, 255, 0.10);
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16.5px; line-height: 1.65; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
  .wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  a { color: var(--link); }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 8px; }
  button, input, select, textarea { font: inherit; color: inherit; }
  h1, h2, h3 { margin: 0; line-height: 1.25; font-weight: 700; text-wrap: balance; }
  p { margin: 0; }
  .grad { background: linear-gradient(100deg, var(--title-2), var(--title-3)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .glass { background: var(--surface); border: 1px solid var(--line); }
  .eyebrow { font-size: 0.85rem; font-weight: 600; color: var(--muted); }
  .section { padding-block: 44px; }
  .section.tint { background: var(--band); }
  .section-title { text-align: center; display: grid; gap: 6px; margin-bottom: 26px; }
  .section-title h2 { font-size: clamp(1.4rem, 3.6vw, 1.85rem); }
  .section-title p { color: var(--muted); max-width: 56ch; margin: 0 auto; }

  /* ---------- header: two rows ---------- */
  header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--surface); border-bottom: 1px solid var(--line); }
  .topbar-in { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding-block: 8px; }
  .where { font-size: 0.85rem; color: var(--muted); font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .logo { display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 0; cursor: pointer; font-weight: 800; font-size: 1.2rem; color: var(--ink); justify-self: center; }
  .logo svg { width: 28px; height: 28px; flex: none; }
  .top-actions { display: flex; gap: 6px; justify-content: flex-end; align-items: center; }
  .hpill { border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); padding: 6px 12px; font-weight: 600; font-size: 0.88rem; cursor: pointer; text-decoration: none; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; }
  .h999 { background: linear-gradient(140deg, var(--red-1), var(--red-2)); color: #fff; border-color: transparent; font-weight: 800; }
  .h999 svg { width: 15px; height: 15px; }
  .round { width: 36px; height: 36px; padding: 0; justify-content: center; }
  .round svg { width: 17px; height: 17px; }
  @media (max-width: 560px) { .topbar-in { grid-template-columns: auto 1fr; } .where { display: none; } .logo { justify-self: start; font-size: 1.05rem; } .hpill { padding: 6px 10px; } }
  .mainnav { border-top: 1px solid var(--line); }
  .nav { display: flex; gap: 4px; justify-content: center; overflow-x: auto; scrollbar-width: none; padding-block: 4px; }
  .nav::-webkit-scrollbar { display: none; }
  .nav button { flex: none; background: none; border: 0; border-radius: 999px; padding: 7px 14px; color: var(--ink); font-weight: 600; font-size: 0.92rem; cursor: pointer; white-space: nowrap; }
  .nav button:hover { background: var(--surface-2); color: var(--link); }
  @media (max-width: 760px) { .nav { justify-content: flex-start; } }

  /* ---------- banner ---------- */
  .hero { padding-block: 22px 30px; background: linear-gradient(180deg, var(--band), var(--bg)); }
  .hero-grid { display: grid; gap: 22px; align-items: center; }
  @media (min-width: 900px) { .hero-grid { grid-template-columns: 1.05fr 0.95fr; } }
  .hero-text { display: grid; gap: 14px; min-width: 0; }
  .hero h1 { font-size: clamp(1.9rem, 5.4vw, 3rem); line-height: 1.2; }
  .hero h1 .grad { display: block; font-size: 0.52em; margin-top: 6px; line-height: 1.4; font-weight: 600; }
  .lead { color: var(--muted); max-width: 50ch; }
  .hero-art { position: relative; overflow: hidden; border-radius: 22px; aspect-ratio: 1.3; max-width: 100%; box-shadow: var(--shadow); isolation: isolate; }
  @media (max-width: 899px) { .hero-art { display: none; } }
  .scene { position: absolute; inset: 0; z-index: -1;
    background: linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 38%, var(--sky-3) 60%, var(--sky-4) 72%, var(--water) 72.5%, var(--water) 100%); }
  .stars { position: absolute; inset: 0 0 35% 0; opacity: var(--stars);
    background-image: radial-gradient(1.5px 1.5px at 12% 18%, #fff 60%, transparent), radial-gradient(1px 1px at 22% 40%, #fff 60%, transparent),
      radial-gradient(1.5px 1.5px at 35% 12%, #fff 60%, transparent), radial-gradient(1px 1px at 48% 30%, #fff 60%, transparent),
      radial-gradient(2px 2px at 63% 9%, #fff 60%, transparent), radial-gradient(1px 1px at 72% 34%, #fff 60%, transparent),
      radial-gradient(1.5px 1.5px at 84% 16%, #fff 60%, transparent), radial-gradient(1px 1px at 93% 42%, #fff 60%, transparent); }
  .orb { position: absolute; width: 22%; aspect-ratio: 1; right: 12%; top: 46%; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--orb-1), var(--orb-2) 70%); box-shadow: 0 0 70px 16px color-mix(in srgb, var(--orb-2) 55%, transparent); }
  .arch { position: absolute; left: 30%; top: 12%; width: 40%; aspect-ratio: 0.82; border-radius: 999px 999px 0 0; border: 14px solid transparent; border-bottom: 0;
    background: linear-gradient(160deg, rgba(255,255,255,0.95), var(--violet-1) 45%, var(--sky-4) 85%) border-box;
    -webkit-mask: linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
    filter: drop-shadow(0 0 16px color-mix(in srgb, var(--violet-1) 70%, transparent)); }
  .gem { position: absolute; width: 30px; height: 30px; border-radius: 8px; transform: rotate(var(--rot, 18deg));
    background: linear-gradient(135deg, rgba(255,255,255,0.9), var(--c, #8ee6ff) 45%, rgba(0,0,0,0.25)); box-shadow: 0 0 20px var(--c, #8ee6ff), inset 0 0 8px rgba(255,255,255,0.6); }
  .g1 { --c: #7FE3FF; left: 18%; top: 20%; --rot: 24deg; } .g2 { --c: #B58CFF; left: 44%; top: 30%; width: 42px; height: 42px; --rot: -14deg; }
  .g3 { --c: #FFC75A; right: 12%; top: 18%; width: 26px; height: 26px; --rot: 40deg; } .g4 { --c: #FF8FD1; left: 26%; top: 52%; width: 20px; height: 20px; }
  .hills { position: absolute; left: 0; right: 0; bottom: 27%; width: 100%; height: 22%; }
  .hills .h1 { fill: var(--hill-1); } .hills .h2 { fill: var(--hill-2); }
  @media (prefers-reduced-motion: no-preference) {
    .gem { animation: float 7s ease-in-out infinite; } .g2 { animation-duration: 9s; } .g3 { animation-duration: 6s; animation-delay: -2s; }
    @keyframes float { 50% { translate: 0 -8px; } }
  }

  /* warm opening */
  .greet { display: inline-flex; align-items: center; gap: 8px; justify-self: start; font-weight: 600; font-size: 0.92rem; color: var(--ink);
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 14px 5px 8px; box-shadow: var(--shadow); }
  .greet .dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 0.8rem;
    background: linear-gradient(140deg, var(--amber-1), var(--amber-2)); color: var(--amber-ink); }
  .trust { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: 0.88rem; font-weight: 600; }
  .trust li { display: inline-flex; align-items: center; gap: 6px; }
  .trust li::before { content: "✓"; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; background: var(--ok); color: #fff; font-size: 0.7rem; font-weight: 800; }
  .welcome { display: grid; gap: 10px; border-radius: var(--r); padding: 16px 18px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); border-left: 4px solid var(--amber-1); }
  .welcome h2 { font-size: 1.08rem; }
  .welcome ol { margin: 0; padding-left: 1.3em; display: grid; gap: 4px; color: var(--muted); font-size: 0.94rem; }
  .welcome .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .calm { color: var(--muted); font-size: 0.92rem; margin-top: -4px; }

  /* the three big actions */
  .actions { display: grid; gap: 10px; }
  .act { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; text-align: left; width: 100%;
    border-radius: var(--r); padding: 12px 14px; cursor: pointer; text-decoration: none; color: var(--ink); box-shadow: var(--shadow); }
  .act > span:nth-child(2) { display: grid; min-width: 0; }
  .act strong { font-weight: 700; font-size: 1.1rem; line-height: 1.3; }
  .act small { color: var(--muted); font-size: 0.86rem; line-height: 1.45; }
  .tile { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; color: var(--on-color); }
  .tile svg { width: 26px; height: 26px; }
  .arrow { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); }
  .arrow svg { width: 16px; height: 16px; }
  .act.red { border-color: color-mix(in srgb, var(--red-1) 50%, transparent); }
  .act.red strong { color: var(--red-1); }
  .act.red .tile { background: linear-gradient(140deg, var(--red-1), var(--red-2)); }
  .act.violet .tile { background: linear-gradient(140deg, var(--violet-1), var(--violet-2)); }
  .act.amber .tile { background: linear-gradient(140deg, var(--amber-1), var(--amber-2)); color: var(--amber-ink); }
  .act[aria-busy="true"] { opacity: 0.7; cursor: progress; }
  .who-list { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
  .who-list span { background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 0 10px; font-size: 0.8rem; font-weight: 600; color: var(--ink); }

  /* ---------- round icon row ---------- */
  .icons { padding-block: 22px; background: var(--surface); border-block: 1px solid var(--line); }
  .icon-row { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(96px, 1fr); gap: 6px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: thin; padding-bottom: 4px; }
  .icon-item { scroll-snap-align: start; display: grid; justify-items: center; gap: 6px; text-align: center; padding: 8px 4px; border-radius: 12px; text-decoration: none; color: var(--ink);
    background: none; border: 0; cursor: pointer; }
  .icon-item:hover { background: var(--surface-2); }
  .icon-item .circle { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; color: var(--on-color); box-shadow: var(--shadow); }
  .icon-item .circle svg { width: 26px; height: 26px; }
  .icon-item b { font-size: 0.86rem; font-weight: 600; line-height: 1.3; }
  .icon-item small { font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .c-red { background: linear-gradient(140deg, var(--red-1), var(--red-2)); }
  .c-orange { background: linear-gradient(140deg, #FF9B5C, #E8542E); }
  .c-green { background: linear-gradient(140deg, #3FC98A, #14895A); }
  .c-pink { background: linear-gradient(140deg, #FF7AB8, #C8327E); }
  .c-blue { background: linear-gradient(140deg, #6FA8FF, #2E5BD6); }
  .c-teal { background: linear-gradient(140deg, #4FD6D0, #13858F); }
  .c-violet { background: linear-gradient(140deg, var(--violet-1), var(--violet-2)); }
  .c-amber { background: linear-gradient(140deg, var(--amber-1), var(--amber-2)); color: var(--amber-ink); }
  .c-slate { background: linear-gradient(140deg, #9AA3C7, #59618A); }

  /* ---------- search band ---------- */
  .search-band { display: grid; gap: 22px; align-items: center; }
  @media (min-width: 900px) { .search-band { grid-template-columns: 1.3fr 0.7fr; } }
  .search-band h2 { font-size: clamp(1.35rem, 3.6vw, 1.8rem); }
  .search-band .intro { display: grid; gap: 6px; margin-bottom: 14px; }
  .search-band .intro p { color: var(--muted); }
  .find-art { display: none; justify-self: center; width: min(240px, 100%); max-width: 100%; }
  @media (min-width: 900px) { .find-art { display: block; } }
  .find-art .pin { fill: var(--accent); } .find-art .pin2 { fill: var(--red-1); } .find-art .map { fill: var(--surface); stroke: var(--line); stroke-width: 2; } .find-art .road { stroke: var(--sky-3); stroke-width: 6; fill: none; }
  .finder { position: relative; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .searchbar { display: flex; align-items: center; gap: 8px; border-radius: 12px; padding: 6px; background: var(--surface); border: 2px solid var(--line); box-shadow: var(--shadow); }
  .searchbar:focus-within { border-color: var(--accent); }
  .searchbar svg { width: 20px; height: 20px; flex: none; color: var(--muted); margin-left: 8px; }
  .searchbar input { flex: 1; min-width: 0; border: 0; background: none; padding: 10px 0; font-size: 1.05rem; outline: none; }
  .searchbar select { border: 0; border-radius: 9px; background: var(--accent); color: var(--accent-ink); padding: 10px 12px; font-weight: 700; font-size: 0.92rem; max-width: 44%; cursor: pointer; }
  .hint { color: var(--muted); font-size: 0.9rem; }
  .suggest { list-style: none; margin: 0; padding: 6px; display: grid; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
  .suggest button { width: 100%; text-align: left; background: none; border: 0; border-radius: 10px; padding: 10px 12px; cursor: pointer; display: grid; color: var(--ink); }
  .suggest button:hover, .suggest button:focus-visible { background: var(--surface-2); }
  .suggest b { font-weight: 600; } .suggest span { color: var(--muted); font-size: 0.88rem; }
  .none { padding: 10px 12px; color: var(--muted); font-size: 0.92rem; }
  .suggest .group { padding: 8px 12px 2px; font-size: 0.8rem; font-weight: 700; color: var(--link); }
  .fallback-box { display: grid; gap: 10px; padding: 10px 12px 12px; border-top: 1px solid var(--line); margin-top: 4px; }
  .fallback-box p { font-size: 0.92rem; font-weight: 600; }
  .suggest .fallback-box .chip, .suggest .fallback-box .btn { width: auto; display: inline-flex; border-radius: 999px; }
  .suggest .fallback-box .chip { font-size: 0.88rem; padding: 4px 12px; background: var(--surface-2); }
  .suggest .fallback-box .btn { padding: 8px 16px; }
  .suggest .fallback-box .btn.violet { background: linear-gradient(140deg, var(--violet-1), var(--violet-2)); color: var(--on-color); }
  .recent { justify-self: start; }
  .msg { font-weight: 600; padding: 12px 16px; border-radius: 12px; background: var(--warn-bg); color: var(--warn); }
  .msg.plain { background: var(--surface); color: var(--ink); font-weight: 500; border: 1px solid var(--line); }
  .demo { display: grid; gap: 8px; border: 1px dashed var(--line); border-radius: 12px; padding: 12px 14px; background: var(--surface-2); }
  .demo p { color: var(--muted); font-size: 0.88rem; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: 0.95rem; color: var(--ink); }
  .chip[aria-pressed="true"] { background: linear-gradient(140deg, var(--violet-1), var(--violet-2)); color: var(--on-color); border-color: transparent; font-weight: 600; }
  .home-msgs { display: grid; gap: 12px; margin-top: 14px; }
  .home-msgs:empty { display: none; }

  /* ---------- cards ---------- */
  .grid-3 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; display: grid; grid-template-rows: auto 1fr; box-shadow: var(--shadow); min-width: 0; }
  .card .art { aspect-ratio: 2.2; max-width: 100%; position: relative; }
  .card .body { padding: 16px 18px 18px; display: grid; gap: 8px; align-content: start; }
  .card h3 { font-size: 1.1rem; }
  .card p { color: var(--muted); font-size: 0.95rem; }
  .card .btn-primary { margin-top: 6px; }
  .btn-primary { justify-self: start; display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 10px; padding: 10px 18px; font-weight: 700; cursor: pointer; text-decoration: none;
    background: var(--accent); color: var(--accent-ink); }
  .btn-primary svg { width: 16px; height: 16px; }
  .art.night { background: radial-gradient(30% 40% at 75% 30%, #fff6d8, #f7c56b 45%, transparent 47%), linear-gradient(180deg, #1a1244, #4b2c8a 60%, #2a1b55 61%, #1a1240); }
  .art.lost { background: radial-gradient(28% 50% at 30% 55%, rgba(255,255,255,0.85), transparent 52%), repeating-linear-gradient(45deg, #6a3aa8 0 14px, #7b4bc0 14px 28px); }
  .art.storm { background: linear-gradient(160deg, transparent 48%, #ffd66b 49%, #ffd66b 51%, transparent 52%), linear-gradient(180deg, #2b3a7a, #5866b8 55%, #3d7fb8 56%, #234d7a); }
  .art.town { background: radial-gradient(60% 40% at 50% 100%, rgba(255, 190, 110, 0.9), transparent 70%), repeating-linear-gradient(90deg, transparent 0 14px, rgba(255, 220, 140, 0.5) 14px 16px, transparent 16px 30px), linear-gradient(180deg, #2a1d6b, #6a3aa8 60%, #f39a7c); }

// Sound key: Bangla and typed English both become a consonant skeleton, so
// "hasanhat", "hason haat" and "হাসান হাট" all become "hsnht".
const BN_LAT = { 'ক': 'k', 'খ': 'k', 'গ': 'g', 'ঘ': 'g', 'ঙ': 'ng', 'চ': 'c', 'ছ': 's', 'জ': 'j', 'ঝ': 'j', 'ঞ': 'n', 'ট': 't', 'ঠ': 't',
  'ড': 'd', 'ঢ': 'd', 'ণ': 'n', 'ত': 't', 'থ': 't', 'দ': 'd', 'ধ': 'd', 'ন': 'n', 'প': 'p', 'ফ': 'f', 'ব': 'b', 'ভ': 'b', 'ম': 'm',
  'য': 'j', 'র': 'r', 'ল': 'l', 'শ': 's', 'ষ': 's', 'স': 's', 'হ': 'h', 'ড়': 'r', 'ঢ়': 'r', 'ৎ': 't', 'ং': 'ng', 'ক্ষ': 'k' };

function wordKey(w) {
  const lead = /^[aeiouঅ-ঔ]/.test(w) ? '@' : '';   // a word that starts with a vowel keeps a marker: "inani", "enani", "ইনানী" -> "@n"
  let s = w.replace(/য়/g, '').replace(/[ডঢ]়/g, 'র');   // য় is a vowel sound; ড়/ঢ় sound like র
  s = s.replace(/[ঀ-৿]/g, (ch) => BN_LAT[ch] ?? '');
  s = s.replace(/c(?=[aou])/g, 'k');           // English "cox": c before a/o/u sounds like k
  s = s.replace(/ch/g, 'c').replace(/sh/g, 's').replace(/kh/g, 'k').replace(/gh/g, 'g').replace(/th/g, 't').replace(/dh/g, 'd')

}
function soundKey(text) {
  return norm(text).toLowerCase().replace(GENERIC, ' ').split(/[\s,.'’\-]+/).filter(Boolean).map(wordKey).join('');
}
function editDistance(a, b) {
  if (Math.abs(a.length - b.length) > 3) return 9;

  for (let i = 1; i <= a.length; i++) {

    for (let j = 1; j <= b.length; j++) {
      const tmp = prev[j];
      prev[j] = Math.min(prev[j] + 1, prev[j - 1] + 1, diag + (a[i - 1] === b[j - 1] ? 0 : 1));

  }

}

}
function buildIndex() {
  areaIndex = [];

      addItem({ kind: 'upazila', place: { district: d.key, upazila: u.en, area: null } }, [u.bn, u.en]);
      for (const a of localAreas(doc, u.en)) addItem({ kind: a.type, place: { district: d.key, upazila: u.en, area: a } }, [a.bn.split(/[,،]/)[0], a.en || '']);

}
// Lower score = better. 0-2 text match, 3 same sound, 4 sound starts the same: these are real matches.

function scoreItem(item, s, key) {
  const w = item.words.split(/\s+/);

  if (w.some((x) => x.startsWith(s))) return 1;

    const sc = scoreItem(item, s, key);

  const nat = (id) => data.national.find((n) => n.id === id);
  first.append(firstRow(t().what.emergency, nat('national-emergency-999'), true));
  if (groups) {
    const g = (id) => groups.find((x) => x.id === id);
    const pick = (id) => (g(id)?.items || []).find((r) => withPhone(r) && r.kind !== 'national');
    const police = pick('police');
    if (police) first.append(firstRow(t().what.police, police));
    if (p.area && pick('tourist_police') && p.district === 'coxsbazar') first.append(firstRow(t().what.tourist_police, nat('tourist-police-helpline')));
    const local = p.area?.type === 'municipality' ? pick('town') : pick('local');
    if (local) first.append(firstRow(p.area?.type === 'municipality' ? t().what.town : t().what.local, local));
    else { const uno = pick('administration'); if (uno) first.append(firstRow(t().what.administration, uno)); }
  }

  // more help
  const more = $('moreList');
  more.replaceChildren();
  const list = groups
    ? groups.filter((gr) => gr.id !== 'emergency')
    : [{ id: 'helplines', items: NATIONAL_EVERYWHERE.slice(1).map(nat).filter(Boolean) }];
  for (const gr of list) {
    const items = gr.items;
    const callable = items.filter(withPhone).length;
    const d = el('details', 'cat');
    const s = el('summary');
    s.append(el('span', null, t().groups[gr.id] || gr.id), el('span', 'count', digits(callable)));
    d.append(s);
    const body = el('div', 'cat-body');
    if (gr.fallback) body.append(el('p', 'fallback', t().fallback));
    if (gr.noNumbers) body.append(el('p', 'fallback', t().noNumbers));
    const sorted = [...items].sort((a, b) => withPhone(b) - withPhone(a));
    sorted.forEach((r, i) => { const row = personRow(r); if (i >= VISIBLE) row.hidden = true; body.append(row); });
    if (sorted.length > VISIBLE) {
      const b = el('button', 'btn showall', t().showAll(digits(sorted.length))); b.type = 'button';
      b.addEventListener('click', () => { body.querySelectorAll('.person[hidden]').forEach((x) => { x.hidden = false; }); b.remove(); });
      body.append(b);
    }
    d.append(body);
    more.append(d);
  }
  if (!groups) more.firstChild.open = true;
}

/* ---------- location ---------- */
function msg(text) { $('locMsg').textContent = text; $('locMsg').hidden = !text; }
function resolvePlace(pos) {
  const found = locations && nearestPlace(locations, pos);
  if (!found) return { outside: true };
  const place = { district: found.district, upazila: found.upazila, area: found.area };
  const doc = data.docs[found.district];
  const named = found.area && (doc.places || []).find((x) => norm(x.union_bn) === found.area.bn);
  if (named) place.placeId = named.id;
  if (found.area) {
    const full = localAreas(doc, found.upazila).find((a) => a.type === found.area.type && a.bn === found.area.bn);
    if (full) place.area = full;
  }
  return place;
}
function applyPosition(pos) { lastFix = { pos, at: Date.now() }; openArea(resolvePlace(pos), pos); }
function demoPicks() {
  if (!locations) return [];

    [locations.unions.find((u) => u.union_en === 'Jaliapalong'), { bn: 'ইনানী সৈকত', en: 'Inani beach' }],
    [locations.unions.find((u) => u.district === 'Noakhali' && u.upazila_en === 'Hatiya'), { bn: 'হাতিয়া', en: 'Hatiya' }],
    [{ lat: 23.8103, lon: 90.4125 }, { bn: 'ঢাকা (জেলার বাইরে)', en: 'Dhaka (outside)' }],
  ].filter(([p]) => p);

}
function fillDemo(box, textEl, chipsEl, onPick) {

async function locate() {

let lastFix = null;          // { pos, at }
let sos = { situation: 'danger', pos: null, place: null, state: 'idle', edited: false };
const toAscii = (s) => String(s).replace(/[০-৯]/g, (d) => '০১২৩৪৫৬৭৮৯'.indexOf(d));
function normPhone(raw) {
  let d = toAscii(raw).replace(/\D/g, '');
  if (d.startsWith('880')) d = d.slice(2);
  else if (d.startsWith('88') && d.length === 13) d = d.slice(2);
  return /^01[3-9]\d{8}$/.test(d) ? d : null;
}
function getPeople() { try { return JSON.parse(store.get('sc-family') || '[]').filter((p) => p && normPhone(p.phone)); } catch { return []; } }
function setPeople(list) { store.set('sc-family', JSON.stringify(list)); }

function renderHomeSos() {

function sosMessage() {
  const s = t();
  const lines = [`${s.urgent} ${s.sits[sos.situation][1]}`];
  if (sos.place && !sos.place.outside) lines.push(s.area(`${placeTitle(sos.place)}, ${placeSub(sos.place)}`));
  lines.push(sos.pos ? s.mapLine(mapsLink(sos.pos)) : s.noLoc);
  const time = new Intl.DateTimeFormat(lang === 'bn' ? 'bn-BD' : 'en-GB', { hour: 'numeric', minute: '2-digit' }).format(new Date());
  lines.push(`${s.timeLine(time)} ${s.sign}`);
  return lines.join('\n');
}
function refreshMessage() { if (!sos.edited) $('sosMsg').value = sosMessage(); renderSend(); }

function renderSituations() {
  $('situations').replaceChildren(...Object.entries(t().sits).map(([k, [label]]) => {
    const b = el('button', 'chip', label); b.type = 'button';

}
function renderLoc() {
  const line = $('sosLoc');
  line.className = 'locline';
  if (sos.state === 'getting') line.textContent = t().gettingLoc;
  else if (sos.pos && sos.place && !sos.place.outside) {

  else { line.classList.add('bad'); line.textContent = `${sos.error === 'denied' ? t().sosDenied : t().sosNoLoc} ${t().noLocYet}`; }

function setSosPos(pos) {
  sos.pos = pos; sos.place = resolvePlace(pos); sos.state = 'done';
  lastFix = { pos, at: Date.now() };

}
function renderSend() {
  const people = getPeople();
  const body = () => $('sosMsg').value;
  const list = $('sendList');
  list.replaceChildren();
  if (!people.length) {
    list.append(el('p', 'msg plain', t().noPeople));
    $('peopleBox').open = true;
  }
  for (const p of people) {
    const row = el('div', 'contact');
    const av = el('span', 'avatar', (p.name || '?').trim().charAt(0).toUpperCase());
    const info = el('div');
    info.append(el('b', null, p.rel ? `${p.name} (${p.rel})` : p.name), el('span', 'num', digits(p.phone)));
    const sendRow = el('div', 'send-row');
    const sms = el('a', 'send'); sms.href = `sms:${p.phone}?&body=${encodeURIComponent(body())}`;
    sms.append(document.createTextNode(t().sms), el('small', null, lang === 'bn' ? 'ইন্টারনেট লাগে না' : 'no internet needed'));
    const wa = el('a', 'send alt', t().wa); wa.href = `https://wa.me/88${p.phone}?text=${encodeURIComponent(body())}`; wa.target = '_blank'; wa.rel = 'noopener';
    const call = el('a', 'send alt', t().call); call.href = `tel:${p.phone}`;
    const pair = el('div', 'pair'); pair.append(wa, call);
    sendRow.append(sms, pair);
    row.append(av, info, sendRow);
    list.append(row);
  }
  const tools = $('sendTools');
  tools.replaceChildren();
  if (people.length > 1) {
    const all = el('a', 'btn', t().smsAll(digits(people.length)));
    all.href = `sms:${people.map((p) => p.phone).join(',')}?&body=${encodeURIComponent(body())}`;
    tools.append(all);
  }
  const copy = el('button', 'btn', t().copyMsg); copy.type = 'button';
  copy.addEventListener('click', () => navigator.clipboard?.writeText(body()).then(() => { copy.textContent = t().copied; }, () => { $('sosMsg').select(); }));
  tools.append(copy);
  if (navigator.share) {
    const other = el('button', 'btn', t().other); other.type = 'button';
    other.addEventListener('click', () => navigator.share({ text: body() }).catch(() => {}));
    tools.append(other);
  }
}
function renderPeople() {
  const people = getPeople();
  $('peopleCount').textContent = digits(people.length);
  $('savedList').replaceChildren(...people.map((p, i) => {
    const row = el('div', 'saved');
    row.append(el('span', null, `${p.name}${p.rel ? ` (${p.rel})` : ''} · ${digits(p.phone)}`));
    const rm = el('button', 'linkbtn', t().remove); rm.type = 'button';
    rm.addEventListener('click', () => { const l = getPeople(); l.splice(i, 1); setPeople(l); renderPeople(); renderSend(); renderHomeSos(); });
    row.append(rm);
    return row;
  }));
  $('addForm').hidden = people.length >= 3;
}
async function openSos(pos) {
  sos = { situation: sos.situation || 'danger', pos: null, place: null, state: 'getting', edited: false, error: null };
  renderSituations(); renderPeople();
  showView('sos');
  const fresh = pos || (lastFix && Date.now() - lastFix.at < 120000 ? lastFix.pos : null);
  if (fresh) { setSosPos(fresh); return; }
  renderLoc(); refreshMessage();
  try { setSosPos(await getPosition()); }
  catch (err) {
    sos.state = 'failed'; sos.error = err.code;
    renderLoc(); refreshMessage();
    fillDemo($('sosDemo'), $('sosDemoText'), $('sosDemoChips'), setSosPos);
  }
}
$('sosBtn').addEventListener('click', () => openSos(null));
$('sosBack').addEventListener('click', goHome);

$('addForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const err = $('formErr');
  const name = $('pName').value.trim();
  const phone = normPhone($('pPhone').value);
  const people = getPeople();
  const fail = (m) => { err.textContent = m; err.hidden = false; };
  if (people.length >= 3) return fail(t().maxPeople);
  if (!name) return fail(t().needName);
  if (!phone) return fail(t().badPhone);
  err.hidden = true;
  people.push({ name, rel: $('pRel').value.trim(), phone });
  setPeople(people);
  $('pName').value = ''; $('pRel').value = ''; $('pPhone').value = '';
  renderPeople(); renderSend(); renderHomeSos();
});

      a.append(iconCircle(GP_ICONS[ic], cls), el('b', null, M().icons[id]), el('small', null, digits(n.phones[0])));
      items.push(a);
    }
  }
  const act = (label, sub, ic, cls, fn) => { const b = el('button', 'icon-item'); b.type = 'button'; b.append(iconCircle(GP_ICONS[ic], cls), el('b', null, label), el('small', null, sub)); b.addEventListener('click', fn); return b; };
  items.splice(1, 0, act(M().iconSend, M().iconSendSub, 'send', 'c-violet', () => openSos(null)), act(M().iconNear, M().iconNearSub, 'pin', 'c-amber', () => locate()));
  row.replaceChildren(...items);
}
function primaryBtn(label, fn, href) {
  const b = el(href ? 'a' : 'button', 'btn-primary');
  if (href) { b.href = href; b.target = '_blank'; b.rel = 'noopener'; } else { b.type = 'button'; b.addEventListener('click', fn); }
  b.append(document.createTextNode(label), svg(GP_ICONS.arrow));
  return b;
}
function saveNumbers() { openSos(null); $('peopleBox').open = true; setTimeout(() => $('peopleBox').scrollIntoView({ behavior: 'smooth', block: 'start' }), 50); }
function renderGuides() {
  $('guideTitle').textContent = M().guideTitle; $('guideText').textContent = M().guideText;
  const actions = { sos: () => openSos(null), find: () => findArea(''), locate: () => { goHome(); window.scrollTo(0, 0); locate(); } };
  $('guideCards').replaceChildren(...M().guides.map(([art, title, text, btn, act]) => {
    const c = el('article', 'card');
    const body = el('div', 'body');
    body.append(el('h3', null, title), el('p', null, text), primaryBtn(btn, actions[act]));
    c.append(el('div', `art ${art}`), body);
    return c;
  }));
}
function renderDuo() {
  const [[ic1, t1, p1, b1], [ic2, t2, p2, b2]] = M().duo;
  const card = (ic, cls, title, text, btn) => {
    const c = el('div', 'duo-card'); const d = el('div');
    d.append(el('h3', null, title), el('p', null, text), btn);
    const badge = el('span', `badge-ic ${cls}`); badge.append(svg(GP_ICONS[ic]));
    c.append(d, badge); return c;
  };
  $('duoCards').replaceChildren(card(ic1, 'c-violet', t1, p1, primaryBtn(b1, saveNumbers)), card(ic2, 'c-amber', t2, p2, primaryBtn(b2, null, SITE.report)));
}
function renderHelp() {
  $('helpTitle').textContent = M().helpTitle;
  const [q, src, priv, rep] = M().help;
  const item = (label, ic, fn, href) => {
    const b = el(href ? 'a' : 'button', 'help-item');
    if (href) { b.href = href; b.target = '_blank'; b.rel = 'noopener'; } else { b.type = 'button'; b.addEventListener('click', fn); }
    const c = el('span', 'circle'); c.append(svg(GP_ICONS[ic])); b.append(c, el('span', null, label)); return b;
  };
  $('helpRow').replaceChildren(item(q, 'question', () => goTo('faq')), item(src, 'db', () => openFaq('source')), item(priv, 'lock', () => openFaq('privacy')), item(rep, 'flag', null, SITE.report));
}
function renderNet() {
  $('netTitle').textContent = M().netTitle;
  $('netList').replaceChildren(...M().net.map(([k, text]) => el('li', k === 'soon' ? 'soon' : null, text)));
}
function renderWarm() {
  const h = new Date().getHours();
  const part = h >= 21 || h < 5 ? 'night' : h < 12 ? 'morning' : h < 17 ? 'noon' : 'evening';
  const g = $('greet');
  const dot = el('span', 'dot', part === 'night' ? '☾' : '☀');
  dot.setAttribute('aria-hidden', 'true');
  g.replaceChildren(dot, document.createTextNode(part === 'night' ? M().greet.night : `${M().greet[part]}! ${M().greetTail}`));
  $('trust').replaceChildren(...M().trust.map((x) => el('li', null, x)));
  let seen = false;
  try { seen = localStorage.getItem('sc-welcomed') === '1'; } catch {}
  const w = $('welcome');
  w.hidden = seen;
  if (seen) return;
  const ok = el('button', 'btn', M().welcomeOk); ok.type = 'button';
  ok.addEventListener('click', () => { try { localStorage.setItem('sc-welcomed', '1'); } catch {} w.hidden = true; });
  const save = el('button', 'btn violet', M().welcomeSave); save.type = 'button';
  save.addEventListener('click', () => { try { localStorage.setItem('sc-welcomed', '1'); } catch {} w.hidden = true; saveNumbers(); });
  const ol = el('ol'); M().welcomeSteps.forEach((x) => ol.append(el('li', null, x)));
  const row = el('div', 'row'); row.append(save, ok);
  const title = el('h2', null, M().welcomeTitle); title.id = 'welcomeTitle';
  w.replaceChildren(title, ol, row);
}
function renderPage() {
  renderWarm(); renderNav(); renderAbout(); renderFaq(); renderFooter(); renderGuides(); renderDuo(); renderHelp(); renderNet(); renderIconRow();
  $('findTitle').textContent = M().findTitle; $('findText').textContent = M().findText;
