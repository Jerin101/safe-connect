# GitHub secret scanning: files that are not secrets (issue #118).
# js/firebase-config.js holds the Firebase *web* API key. It is public by design: every visitor's browser
# needs it to talk to Firebase. It is restricted to our websites and to four Firebase APIs (Identity Toolkit,
# Token Service, Firestore, Firebase Installations), and the Firestore security rules decide who may read or
# write what. Real secrets (service-account keys, passwords, tokens) must never be committed; gitleaks
# (.gitleaks.toml, .github/workflows/secret-scan.yml) still checks every file, this one included.
paths-ignore:
  - "js/firebase-config.js"
