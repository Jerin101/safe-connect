# Runs the Firestore security-rule tests in the free emulator on every PR that touches the rules.
# Fake "demo-" project: no real Firebase project, data or secrets are used.
name: Firestore rules tests
on:
  pull_request:
    paths: ['firestore.rules', 'tests/rules/**', 'package.json', 'package-lock.json', 'firebase.json', '.github/workflows/rules-test.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run test:rules
