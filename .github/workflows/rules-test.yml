# Runs the Firestore security-rule tests in the free emulator on every PR (a required check on main, #132).
# Fake "demo-" project: no real Firebase project, data or secrets are used.
name: Firestore rules tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run test:rules
