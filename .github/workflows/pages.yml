# Publishes the site to GitHub Pages and fills in the service worker's VERSION (tools/stamp_version.py).
# The repository keeps VERSION = 'dev'; nobody raises it by hand. On a pull request it only builds and checks.
# Needs Settings → Pages → Source → "GitHub Actions".
name: Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0                       # the whole history: VERSION comes from the last change to a saved file
          persist-credentials: false           # the build only reads
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Copy the committed files (as the branch deploy served them)
        run: mkdir _site && git archive HEAD | tar -x -C _site
      - name: Fill in VERSION
        run: python tools/stamp_version.py _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'   # the github-pages environment also allows only main
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
