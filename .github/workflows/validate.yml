# Runs the data checker on every pull request and on every push to main.
# A pull request with data errors shows a red X and should not be merged.
name: Validate data

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Check data files
        run: python tools/validate_data.py src/data
      - name: Places tests (rules, manual import, validator)
        run: python -m unittest discover -s tests/places_data
      - name: Master area list (T1, both directions)
        run: python -m unittest discover -s tests/master_areas
      - name: Upazila polygon pilot (M1.2, Python)
        run: python -m unittest discover -s tests/polygons
      - name: Upazila polygon pilot (M1.2, loader and offline)
        run: node --test tests/polygons-test.mjs
      - name: District polygon layers, loader and nearest union centre (M1.2)
        run: node --test tests/areapoly-test.mjs
      - name: Where the map puts you, model and card (M1.2)
        run: node --test tests/whereami-test.mjs
      - name: GPS -> upazila shapes test
        run: node --test tests/locations/upazila-shapes-test.mjs
      - name: GPS best-fix acquisition tests
        run: node --test tests/geo-test.mjs
      - name: Nationwide approximate location test
        run: node --test tests/location-estimate-test.mjs
      - name: SOS location link and accuracy tests
        run: node --test tests/bipod-test.mjs
      - name: Check main browser script syntax
        run: node --check src/js/preview.js
      - name: Colour contrast and icons (A1)
        run: node --test tests/design/contrast-test.mjs
