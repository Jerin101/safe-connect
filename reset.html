<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- The address holds a one-time code from the reset email: never send it to another site as the "referrer". -->
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>SafeConnect</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15141D" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="css/base.css">
</head>
<body>
<!-- Password reset (issue #74): the page the link in the reset email opens. 999 is plain HTML, so it shows
     before any script, with no internet, and never waits for Firebase. -->
<header class="site">
  <div class="wrap bar1">
    <a class="logo" id="homeLink" href="preview.html">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z"/></svg></span>
      <span class="logo-text">SafeConnect</span>
    </a>
    <div class="top-actions end">
      <a class="hpill h999" id="h999" href="tel:999"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25c1.1.37 2.3.57 3.6.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg><span id="h999Text">৯৯৯</span></a>
      <button class="hpill lang" id="langBtn" type="button" aria-label="Language: English / বাংলা">EN</button>
      <button class="hpill round" id="themeBtn" type="button" aria-label="Night or day"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/></svg></button>
    </div>
  </div>
</header>

<main id="main">
<div class="wrap page reset-page">
  <!-- Help first, as on every sign-in page (docs/DESIGN.md §5): these work with no account and no internet. -->
  <section class="nologin" aria-labelledby="noLoginTitle">
    <b id="noLoginTitle"></b><p id="noLoginText"></p>
    <div class="nologin-btns">
      <a class="btn red" id="rsCall" href="tel:999"></a>
      <a class="btn" id="rsSend" href="preview.html#/send"></a>
    </div>
  </section>

  <div class="si-head"><p class="eyebrow" id="rsEyebrow"></p><h1 id="rsTitle" tabindex="-1"></h1></div>
  <p class="offline-note" id="rsOffline" role="status" hidden></p>
  <p class="msg plain" id="rsStatus" role="status" hidden></p>

  <form class="si-form" id="rsForm" novalidate hidden>
    <p class="rs-who" id="rsWho"></p>
    <label class="field"><span id="rsPassL"></span><input id="rsPass" type="password" autocomplete="new-password" minlength="6" required aria-describedby="rsHint"></label>
    <label class="field"><span id="rsPass2L"></span><input id="rsPass2" type="password" autocomplete="new-password" minlength="6" required aria-describedby="rsHint"></label>
    <p class="si-note" id="rsHint"></p>
    <button class="linkbtn" id="rsShow" type="button"></button>
    <p class="msg" id="rsMsg" role="alert" hidden></p>
    <button class="btn violet wide" id="rsSave" type="submit"></button>
  </form>

  <p class="si-note" id="rsHow" hidden></p>
  <div class="rs-links" id="rsLinks"></div>
</div>
</main>

<script type="module" src="js/reset.js"></script>
</body>
</html>
