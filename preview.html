<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SafeConnect</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15141D" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="css/base.css">
<style>
  /* Page-only styles; shared colours, fonts, header, buttons and sign-in parts are in css/base.css. */
  /* ---------- home shell (v3, issue #72): sidebar on wide screens + feed of rows ---------- */
  .shell { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; padding-block: 20px 40px; }
  .feed { display: grid; gap: 34px; align-content: start; min-width: 0; }
  .rail { display: grid; gap: 20px; align-content: start; min-width: 0; }
  /* The sidebar comes after the feed in the page (999 first for keyboards and screen readers); CSS puts it on the left. */
  @media (min-width: 1060px) {
    main[data-page="home"] .shell { grid-template-columns: 280px minmax(0, 1fr); gap: 32px; }
    main[data-page="home"] .feed { grid-column: 2; grid-row: 1; }
    /* Sticks just under the real header (--header-h is measured in js/preview.js) and scrolls inside itself when the screen is short (issue #103). */
    main[data-page="home"] .rail { grid-column: 1; grid-row: 1; align-self: start; position: sticky; top: calc(var(--header-h) + 16px);
      max-height: calc(100vh - var(--header-h) - 32px); overflow-y: auto; scrollbar-width: thin;
      padding: 4px; margin: -4px; scroll-padding-block: 8px; }   /* padding and scroll-padding keep focus rings from being cut off by the scroll box */
  }
  /* Emergency help card at the top of the sidebar (issue #103); on phones the same buttons are in the feed, so it is hidden there. */
  .helpcard { display: grid; gap: 8px; border: 1px solid var(--line); border-radius: 18px; padding: 16px; background: var(--surface); }
  .helpcard h2 { font-size: 1.1rem; margin-bottom: 2px; }
  .hc-btn { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 8px 12px; border-radius: 12px;
    border: 1px solid var(--line-2); background: var(--bg); color: var(--ink); font: inherit; font-weight: 600; font-size: 0.95rem; text-align: left; text-decoration: none; cursor: pointer; }
  .hc-btn:hover { border-color: var(--accent); }
  .hc-btn svg { width: 20px; height: 20px; flex: none; color: var(--accent); }
  .hc-btn.red { background: var(--danger); color: var(--danger-ink); border-color: transparent; font-weight: 800; }
  .hc-btn.red svg { color: var(--danger-ink); }
  .hc-btn span { display: grid; min-width: 0; }
  .hc-btn small { color: var(--muted); font-weight: 400; font-size: 0.8rem; overflow-wrap: anywhere; }
  @media (max-width: 1059px) { .helpcard { display: none; } }
  /* phones: the district menu is inside "Find area"; the sidebar is only for wide screens (#108) */
  @media (max-width: 1059px) { .rail { display: none; } }
  .morelinks { display: flex; flex-wrap: wrap; gap: 10px; }
  /* "Keep it on your phone" card: the short address (no QR image yet); only on wide screens. */
  .appcard { display: grid; justify-items: center; gap: 8px; text-align: center; border-radius: 18px; padding: 20px 18px; background: var(--tint); border: 1px solid var(--line); }
  .appcard .app-ic { width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; background: var(--surface); color: var(--accent); }
  .appcard .app-ic svg { width: 26px; height: 26px; }
  .appcard b { font-size: 1.1rem; line-height: 1.35; }
  .appcard small { color: var(--ink-2); font-size: 0.86rem; line-height: 1.5; }
  .appcard .app-url { margin-top: 4px; padding: 8px 12px; border-radius: 10px; background: var(--surface); border: 1px dashed var(--line-2); font-weight: 700; font-size: 0.8rem; overflow-wrap: anywhere; text-decoration: none; }
  @media (max-width: 1059px) { .appcard { display: none; } }
  .filter { border: 1px solid var(--line); border-radius: 18px; padding: 20px; display: grid; gap: 10px; background: var(--surface); }
  .filter h2 { font-size: 1.25rem; }
  .filter .field select { width: 100%; min-height: 44px; background: var(--bg); border: 1px solid var(--line-2); border-radius: 10px; padding: 8px 10px; font-size: 1rem; font-weight: 400; }
  .filter .fnote { color: var(--muted); font-size: 0.86rem; }
  .filter .linkbtn { justify-self: start; }

  /* ---------- banner ---------- */
  .hero { border-radius: 22px; padding: 24px; background: radial-gradient(70% 90% at 100% 0%, var(--tint-2), transparent 70%), var(--tint); }
  .hero-text { display: grid; gap: 14px; min-width: 0; }
  .hero h1 { font-size: clamp(1.9rem, 4.6vw, 2.8rem); line-height: 1.18; }
  .hero h1 .grad { display: block; font-size: 0.52em; margin-top: 6px; line-height: 1.4; font-weight: 600; }
  .lead { color: var(--ink-2); max-width: 56ch; }
  .coverage { color: var(--muted); font-size: 0.9rem; max-width: 56ch; margin-top: -6px; }   /* honest coverage (#108) */
  /* scene for the weak-network band */
  .scene { position: absolute; inset: 0; z-index: -1;
    background: linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 38%, var(--sky-3) 60%, var(--sky-4) 72%, var(--water) 72.5%, var(--water) 100%); }
  .stars { position: absolute; inset: 0 0 35% 0; opacity: var(--stars);
    background-image: radial-gradient(1.5px 1.5px at 12% 18%, #fff 60%, transparent), radial-gradient(1px 1px at 22% 40%, #fff 60%, transparent),
      radial-gradient(1.5px 1.5px at 35% 12%, #fff 60%, transparent), radial-gradient(1px 1px at 48% 30%, #fff 60%, transparent),
      radial-gradient(2px 2px at 63% 9%, #fff 60%, transparent), radial-gradient(1px 1px at 72% 34%, #fff 60%, transparent),
      radial-gradient(1.5px 1.5px at 84% 16%, #fff 60%, transparent), radial-gradient(1px 1px at 93% 42%, #fff 60%, transparent); }
  .orb { position: absolute; width: 22%; aspect-ratio: 1; right: 12%; top: 46%; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--orb-1), var(--orb-2) 70%); box-shadow: 0 0 70px 16px color-mix(in srgb, var(--orb-2) 55%, transparent); }
  .hills { position: absolute; left: 0; right: 0; bottom: 27%; width: 100%; height: 22%; }
  .hills .h1 { fill: var(--hill-1); } .hills .h2 { fill: var(--hill-2); }

  /* warm opening */
  .greet { display: inline-flex; align-items: center; gap: 8px; justify-self: start; font-weight: 600; font-size: 0.92rem; color: var(--ink);
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 14px 5px 8px; box-shadow: var(--shadow); }
  .greet .dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 0.8rem;
    background: linear-gradient(140deg, var(--amber-1), var(--amber-2)); color: var(--amber-ink); }
  .trust { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: 0.88rem; font-weight: 600; }
  .trust li { display: inline-flex; align-items: center; gap: 6px; }
  .trust li::before { content: "✓"; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; background: var(--ok); color: var(--on-color); font-size: 0.7rem; font-weight: 800; }
  .welcome { display: grid; gap: 10px; border-radius: var(--r); padding: 16px 18px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); border-left: 4px solid var(--amber-1); }
  .welcome h2 { font-size: 1.08rem; }
  .welcome ol { margin: 0; padding-left: 1.3em; display: grid; gap: 4px; color: var(--muted); font-size: 0.94rem; }
  .welcome .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .welcome h3 { font-size: 1.08rem; }
  /* My area on home (issue #105) */
  .myarea { display: grid; gap: 12px; align-content: start; }
  .myarea:empty { display: none; }   /* page shown before the data has loaded */
  .myarea .linkbtn { justify-self: start; min-height: 44px; }
  .myarea .muted { color: var(--muted); }
  .myarea > .btn { justify-self: start; }
  .auto-box { display: grid; gap: 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
  .auto-box > :not(.switch) { margin-inline: 16px; }
  .auto-box > :last-child:not(.switch) { margin-bottom: 14px; }
  .auto-box .switch { border-bottom: 0; }
  .auto-ask { display: grid; gap: 10px; color: var(--ink-2); font-size: 0.94rem; }
  .auto-ask .row, .wcard .auto-ask .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .calm { color: var(--muted); font-size: 0.92rem; margin-top: -4px; }

  /* the three big actions: 999 first; one under the other on phones, side by side from 720 px (DESIGN.md §3b) */
  .actions { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .act { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 14px; text-align: left; width: 100%;
    border-radius: var(--r); padding: 12px 14px; cursor: pointer; text-decoration: none; color: var(--ink); box-shadow: var(--shadow); }
  .hero .act { border-color: transparent; }
  .act > span:nth-child(2) { display: grid; min-width: 0; }
  .act strong { font-weight: 700; font-size: 1.1rem; line-height: 1.3; }
  .act small { color: var(--muted); font-size: 0.86rem; line-height: 1.45; }
  .tile { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; color: var(--on-color); }
  .tile svg { width: 26px; height: 26px; }
  .arrow { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); }
  .arrow svg { width: 16px; height: 16px; }
  .hero .act.red { border: 1.5px solid color-mix(in srgb, var(--red-1) 45%, transparent); }
  .act.red strong { color: var(--red-ink); }
  .act.red .tile { background: linear-gradient(140deg, var(--red-1), var(--red-2)); }
  .act.violet .tile { background: linear-gradient(140deg, var(--violet-1), var(--violet-2)); }
  .act.amber .tile { background: linear-gradient(140deg, var(--amber-1), var(--amber-2)); color: var(--amber-ink); }
  .act[aria-busy="true"] { opacity: 0.7; cursor: progress; }
  @media (min-width: 720px) {
    .actions { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .act { grid-template-columns: minmax(0, 1fr); align-content: start; gap: 10px; padding: 14px; }
    .act .arrow { display: none; }
    .act strong { font-size: 1.02rem; }
  }
  .who-list { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
  .who-list span { background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 0 10px; font-size: 0.8rem; font-weight: 600; color: var(--ink); }

  /* short phones (e.g. 360x640): a compact banner so all 3 big actions fit without scrolling (DESIGN.md §3) */
  @media (max-height: 799px) and (max-width: 899px) {
    .shell { padding-block: 8px 32px; gap: 24px; }
    .feed { gap: 28px; }
    .hero { padding: 10px 12px 14px; border-radius: 18px; }
    .hero-text { gap: 8px; }
    .greet { font-size: 0.8rem; padding: 3px 12px 3px 6px; }
    .greet .dot { width: 18px; height: 18px; font-size: 0.7rem; }
    .hero h1 { font-size: 1.55rem; }
    .hero h1 .grad { font-size: 0.6em; margin-top: 2px; line-height: 1.3; }
    .lead { font-size: 0.86rem; line-height: 1.45; }
    .actions { gap: 6px; }
    .act { padding: 6px 10px; gap: 10px; min-height: 44px; }
    .act strong { font-size: 1rem; line-height: 1.25; }
    .act small { font-size: 0.78rem; line-height: 1.3; }
    .tile { width: 40px; height: 40px; border-radius: 11px; }
    .tile svg { width: 21px; height: 21px; }
    .arrow { width: 28px; height: 28px; }
  }
  /* very short phones (e.g. 320x568): the greeting and the calm line step aside so 999 and the other 2 actions stay on the first screen */
  @media (max-height: 600px) and (max-width: 899px) { .hero .greet, .hero .lead { display: none; } }
  .home-msgs { display: grid; gap: 12px; margin-top: 14px; }
  .home-msgs:empty { display: none; }

  /* ---------- rows (v3): a title with arrows, then cards ---------- */
  .row-sec { display: grid; gap: 16px; min-width: 0; }
  .row-head { display: flex; align-items: end; justify-content: space-between; gap: 12px; }
  .row-head h2 { font-size: clamp(1.35rem, 3vw, 1.75rem); }
  .row-head .soft { color: var(--muted); margin-top: 4px; }
  /* national numbers: quiet tiles that scroll sideways only by hand or with the arrows; only 999's tile is soft red (DESIGN.md §3) */
  /* all national numbers as an open grid, no carousel (#108): compact rows, two side by side on a phone */
  .icon-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 132px), 1fr)); gap: 8px; padding: 4px 0 8px; }
  .icon-item { display: grid; grid-template-columns: 40px minmax(0, 1fr); grid-template-rows: auto auto; gap: 6px 10px; align-items: center; align-content: center; padding: 8px; border-radius: 14px;
    border: 1px solid var(--line); background: var(--surface); text-decoration: none; color: var(--ink); min-height: 44px; }
  .icon-item:hover { border-color: var(--accent); }
  .icon-item .circle { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-2); }
  .icon-item .circle.soft-red { background: var(--danger-soft); color: var(--red-ink); }
  .icon-item .circle svg { width: 20px; height: 20px; }
  .icon-item b { font-size: 0.86rem; font-weight: 700; line-height: 1.3; color: var(--link); overflow-wrap: anywhere; }
  .icon-item small { grid-column: 1 / -1; font-size: 0.92rem; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }   /* the number gets the full width: never cut */
  .c-violet { background: linear-gradient(140deg, var(--violet-1), var(--violet-2)); }
  .c-amber { background: linear-gradient(140deg, var(--amber-1), var(--amber-2)); color: var(--amber-ink); }

  .icon-src .cat-body { padding: 6px 16px 12px; gap: 4px; }
  .icon-src .src { font-size: 0.82rem; color: var(--muted); }

  /* ---------- search band ---------- */
  .search-band { display: grid; gap: 22px; align-items: center; }
  @media (min-width: 900px) { .search-band { grid-template-columns: 1.3fr 0.7fr; } }
  .search-band h2 { font-size: clamp(1.35rem, 3.6vw, 1.8rem); }
  .search-band .intro { display: grid; gap: 6px; margin-bottom: 14px; }
  .search-band .intro p { color: var(--muted); }
  .find-art { display: none; justify-self: center; width: min(240px, 100%); max-width: 100%; }
  @media (min-width: 900px) { .find-art { display: block; } }
  .find-art .pin { fill: var(--accent); } .find-art .pin2 { fill: var(--red-1); } .find-art .map { fill: var(--surface); stroke: var(--line); stroke-width: 2; } .find-art .road { stroke: var(--sky-3); stroke-width: 6; fill: none; }
  .finder { position: relative; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .searchbar { display: flex; align-items: center; gap: 8px; border-radius: 12px; padding: 6px; background: var(--surface); border: 2px solid var(--line); box-shadow: var(--shadow); }
  .searchbar:focus-within { border-color: var(--accent); }
  .searchbar svg { width: 20px; height: 20px; flex: none; color: var(--muted); margin-left: 8px; }
  .searchbar input { flex: 1; min-width: 0; border: 0; background: none; padding: 10px 0; font-size: 1.05rem; outline: none; }
  .searchbar select { border: 0; border-radius: 9px; background: var(--accent); color: var(--accent-ink); padding: 10px 12px; font-weight: 700; font-size: 0.92rem; max-width: 44%; cursor: pointer; }
  .hint { color: var(--muted); font-size: 0.9rem; }
  .suggest { list-style: none; margin: 0; padding: 6px; display: grid; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
  .suggest button { width: 100%; text-align: left; background: none; border: 0; border-radius: 10px; padding: 10px 12px; cursor: pointer; display: grid; color: var(--ink); }
  .suggest button:hover, .suggest button:focus-visible { background: var(--surface-2); }
  .suggest b { font-weight: 600; } .suggest span { color: var(--muted); font-size: 0.88rem; }
  .none { padding: 10px 12px; color: var(--muted); font-size: 0.92rem; }
  .suggest .group { padding: 8px 12px 2px; font-size: 0.8rem; font-weight: 700; color: var(--link); }
  .fallback-box { display: grid; gap: 10px; padding: 10px 12px 12px; border-top: 1px solid var(--line); margin-top: 4px; }
  .fallback-box p { font-size: 0.92rem; font-weight: 600; }
  .suggest .fallback-box .chip, .suggest .fallback-box .btn { width: auto; display: inline-flex; border-radius: 999px; }
  .suggest .fallback-box .chip { font-size: 0.88rem; padding: 4px 12px; background: var(--surface-2); }
  .suggest .fallback-box .btn { padding: 8px 16px; }
  .suggest .fallback-box .btn.violet { background: linear-gradient(140deg, var(--violet-1), var(--violet-2)); color: var(--on-color); }
  .recent { justify-self: start; }
  .demo { display: grid; gap: 8px; border: 1px dashed var(--line); border-radius: 12px; padding: 12px 14px; background: var(--surface-2); }
  .demo p { color: var(--muted); font-size: 0.88rem; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: 0.95rem; color: var(--ink); }
  .chip[aria-pressed="true"] { background: linear-gradient(140deg, var(--violet-1), var(--violet-2)); color: var(--on-color); border-color: transparent; font-weight: 600; }
  /* ---------- cards (v3): a soft tinted top with one line icon, the text under it ---------- */
  .grid-3 { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); }
  /* situation cards: the icon sits beside the title; no empty picture box (#108) */
  .card { display: grid; min-width: 0; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 16px; }
  .card .head { display: flex; align-items: center; gap: 12px; }
  .card .ico { width: 44px; height: 44px; flex: none; border-radius: 14px; display: grid; place-items: center; background: var(--tint); color: var(--accent); }
  .card .ico svg { width: 22px; height: 22px; }
  .card .body { display: grid; gap: 8px; align-content: start; }
  .card h3 { font-size: 1.1rem; }
  .card p { color: var(--muted); font-size: 0.95rem; }
  .card .btn-primary { margin-top: 6px; }

  /* known places (v3): an icon tile and the name, side by side */
  .places { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 180px), 1fr)); }
  .place { display: grid; grid-template-columns: 64px minmax(0, 1fr); align-items: center; gap: 12px; padding: 10px; border: 1px solid var(--line); border-radius: var(--r);
    background: var(--surface); color: var(--ink); text-align: left; cursor: pointer; min-width: 0; }
  .place:hover { border-color: var(--line-2); }
  .place .thumb { width: 64px; height: 64px; border-radius: 14px; display: grid; place-items: center; background: var(--tint); color: var(--accent); }
  .place .thumb svg { width: 28px; height: 28px; }
  .place .label { display: grid; gap: 2px; min-width: 0; }
  .place .label b { font-weight: 700; font-size: 1rem; line-height: 1.3; }
  .place .label small { color: var(--muted); font-size: 0.84rem; line-height: 1.4; }

  /* the area search as one card (v3) */
  .findcard { border: 1px solid var(--line); border-radius: 18px; padding: 20px; background: var(--surface); }

  /* stats strip */
  .stats { border-radius: var(--r); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 6px; margin-top: 22px; }
  @media (min-width: 760px) { .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .stat { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; align-items: center; padding: 12px; }
  .stat .ic { grid-row: span 2; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--accent); }
  .stat .ic svg { width: 19px; height: 19px; }
  .stat b { font-size: 1.2rem; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 0.84rem; line-height: 1.25; }

  /* two side-by-side cards */
  .duo { display: grid; gap: 16px; }
  @media (min-width: 760px) { .duo { grid-template-columns: 1fr 1fr; } }
  .duo-card { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; border-radius: var(--r); padding: 22px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
  .duo-card > div { display: grid; gap: 8px; min-width: 0; }
  .duo-card h3 { font-size: 1.12rem; }
  .duo-card p { color: var(--muted); font-size: 0.95rem; }
  .duo-card .badge-ic { width: 76px; height: 76px; border-radius: 22px; display: grid; place-items: center; color: var(--on-color); }
  .duo-card .badge-ic svg { width: 36px; height: 36px; }
  @media (max-width: 400px) { .duo-card { padding: 18px; gap: 12px; } .duo-card .badge-ic { width: 52px; height: 52px; border-radius: 16px; } .duo-card .badge-ic svg { width: 26px; height: 26px; } }

  /* ---------- inner pages ---------- */
  .page-title { font-size: clamp(1.5rem, 5vw, 2rem); }
  .here { border-radius: var(--r); padding: 18px; display: grid; gap: 4px; box-shadow: var(--shadow); }
  .here .label { color: var(--muted); font-size: 0.85rem; font-weight: 600; }
  .here h1 { font-size: clamp(1.45rem, 5vw, 1.95rem); }
  .here .sub { color: var(--muted); }
  .here-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .share { border-radius: var(--r); padding: 16px 18px; display: grid; gap: 8px; }
  .share h2 { font-size: 1.12rem; }
  .share p { color: var(--muted); font-size: 0.9rem; }
  .note { border-left: 4px solid var(--amber-1); background: var(--surface); border-radius: 0 12px 12px 0; padding: 10px 14px; }
  .auto-note { display: grid; gap: 2px; }
  .auto-note .linkbtn { justify-self: start; min-height: 44px; }
  .first { display: grid; gap: 10px; }
  .first > h2, .more > h2 { font-size: 1.22rem; }
  .first-row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; border-radius: var(--r); padding: 12px 12px 12px 16px; }
  .first-row > div { min-width: 0; display: grid; }
  .first-row .what { font-weight: 700; font-size: 1.06rem; line-height: 1.3; }
  .first-row .who { color: var(--muted); font-size: 0.9rem; overflow-wrap: anywhere; }
  .call { background: linear-gradient(140deg, var(--amber-1), var(--amber-2)); color: var(--amber-ink); border: 0; border-radius: 12px; padding: 10px 14px; font-weight: 700; text-decoration: none;
    text-align: center; line-height: 1.15; display: grid; font-variant-numeric: tabular-nums; min-width: 96px; }
  .call small { font-weight: 600; font-size: 0.78rem; }
  .call.red { background: linear-gradient(140deg, var(--red-1), var(--red-2)); color: var(--on-color); }
  .more { display: grid; gap: 10px; }
  details.cat { border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); }
  details.cat > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 14px 16px; font-weight: 600; }
  details.cat > summary::-webkit-details-marker { display: none; }
  details.cat > summary .count { margin-left: auto; color: var(--muted); font-weight: 500; font-size: 0.9rem; font-variant-numeric: tabular-nums; background: var(--surface-2); border-radius: 999px; padding: 0 10px; }
  details.cat > summary::after { content: "›"; font-size: 1.4rem; line-height: 1; color: var(--muted); transition: transform .15s; }
  details.cat[open] > summary::after { transform: rotate(90deg); }
  .cat-body { display: grid; border-top: 1px solid var(--line); }
  .cat-body .fallback { margin: 10px 16px 0; font-size: 0.88rem; color: var(--warn); }
  .person { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .person:last-child { border-bottom: 0; }
  .person > div { min-width: 0; display: grid; gap: 2px; }
  .person .name { font-weight: 700; overflow-wrap: anywhere; }
  .person .role { font-size: 0.9rem; color: var(--muted); overflow-wrap: anywhere; }
  .person .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .person .calls { display: grid; gap: 6px; justify-items: end; }
  .person .call { min-width: 0; padding: 8px 12px; }
  .person .src { grid-column: 1 / -1; font-size: 0.78rem; color: var(--muted); }
  .showall { margin: 10px 16px 12px; justify-self: start; }
  .panel { border-radius: var(--r); padding: 16px 18px; display: grid; gap: 10px; }
  .panel > * { min-width: 0; }
  .panel h2 { font-size: 1.12rem; }
  .locline { font-weight: 600; display: flex; gap: 8px; align-items: baseline; }
  .locline::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; transform: translateY(-1px); }
  .locline.ok::before { background: var(--ok); }
  .locbtn { justify-self: start; }
  .locline.bad { color: var(--warn); } .locline.bad::before { background: var(--warn); }
  .contact { display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; align-items: center; padding-block: 10px; border-bottom: 1px solid var(--line); }
  .contact:last-of-type { border-bottom: 0; }
  .contact > div { min-width: 0; display: grid; }
  .avatar { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(140deg, var(--violet-1), var(--violet-2)); color: var(--on-color); display: grid; place-items: center; font-weight: 800; font-size: 1.1rem; }
  .contact .num { color: var(--muted); font-size: 0.9rem; font-variant-numeric: tabular-nums; }
  .send-row { grid-column: 1 / -1; display: grid; gap: 8px; }
  .send-row .pair { display: flex; flex-wrap: wrap; gap: 8px; }
  .send-row .pair .send { flex: 1 1 7.5rem; }
  .send { display: grid; place-items: center; text-align: center; border-radius: 12px; padding: 12px; font-weight: 700; text-decoration: none; border: 0; cursor: pointer;
    background: linear-gradient(140deg, var(--violet-1), var(--violet-2)); color: var(--on-color); line-height: 1.2; }
  .send-row > .send { padding-block: 14px; font-size: 1.1rem; }
  .send.alt { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); }
  .send small { font-weight: 500; font-size: 0.78rem; opacity: 0.9; }
  .send:disabled { opacity: 0.55; cursor: not-allowed; }
  .send-note { display: grid; gap: 8px; justify-items: start; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; }
  .saved { display: flex; align-items: center; gap: 10px; padding-block: 8px; border-bottom: 1px solid var(--line); }
  .saved span { margin-right: auto; min-width: 0; overflow-wrap: anywhere; }
  .linkbtn { background: none; border: 0; padding: 0; color: var(--link); cursor: pointer; font-weight: 600; }
  .privacy { color: var(--muted); font-size: 0.85rem; }


  /* about */
  .about { display: grid; gap: 22px; }
  @media (min-width: 860px) { .about { grid-template-columns: 0.9fr 1.1fr; gap: 48px; align-items: start; } }
  .about h2 { font-size: clamp(1.4rem, 3.6vw, 1.85rem); }
  .about .intro { display: grid; gap: 10px; }
  .about .intro p { color: var(--muted); max-width: 46ch; }
  .points { display: grid; border-top: 1px solid var(--line); }
  .point { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; padding-block: 16px; border-bottom: 1px solid var(--line); }
  .point .ic { grid-row: span 2; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); color: var(--accent); }
  .point .ic svg { width: 20px; height: 20px; }
  .point span { color: var(--muted); font-size: 0.94rem; }

  /* how can we help */
  .help-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; max-width: 760px; margin: 0 auto; }
  @media (min-width: 640px) { .help-row { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .help-item { display: grid; justify-items: center; gap: 10px; text-align: center; padding: 12px 6px; border-radius: 12px; background: none; border: 0; cursor: pointer; color: var(--ink); font-weight: 600; text-decoration: none; }
  .help-item:hover { background: var(--surface); }
  .help-item .circle { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); }
  .help-item .circle svg { width: 24px; height: 24px; }

  /* feature band */
  .feature { position: relative; overflow: hidden; isolation: isolate; padding-block: 56px; }
  .feature .scene { position: absolute; inset: 0; z-index: -1; }
  .feature .hills { bottom: 20%; }
  .feature-box { max-width: 460px; border-radius: 22px; padding: 26px; display: grid; gap: 14px; background: color-mix(in srgb, var(--surface) 82%, transparent); border: 1px solid var(--line); box-shadow: var(--shadow); }
  .feature-box h2 { font-size: clamp(1.3rem, 3.4vw, 1.7rem); }
  .ticks { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .ticks li { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; }
  .ticks li::before { content: "✓"; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--ok); color: var(--on-color); font-size: 0.8rem; font-weight: 800; margin-top: 2px; }
  .ticks li.soon::before { content: "…"; background: var(--muted); }

  /* faq */
  .faq { display: grid; gap: 14px; }
  @media (min-width: 860px) { .faq { grid-template-columns: 0.9fr 1.1fr; gap: 48px; align-items: start; } }
  .faq h2 { font-size: clamp(1.4rem, 3.6vw, 1.85rem); }
  .faq-list { border-top: 1px solid var(--line); }
  .faq-list details { border-bottom: 1px solid var(--line); }
  .faq-list summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; gap: 16px; padding-block: 16px; font-weight: 600; }
  .faq-list summary::-webkit-details-marker { display: none; }
  .faq-list summary::after { content: "+"; color: var(--link); font-size: 1.3rem; line-height: 1; }
  .faq-list details[open] summary::after { content: "−"; }
  .faq-list p { color: var(--muted); padding-bottom: 16px; max-width: 60ch; }

  /* ---------- footer (column style) ---------- */
  footer { background: var(--foot-bg); color: var(--foot-ink); border-top: 1px solid var(--foot-line); }
  footer .wrap { padding-block: 40px 24px; display: grid; gap: 30px; }
  .foot-grid { display: grid; gap: 28px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  @media (min-width: 900px) { .foot-grid { grid-template-columns: 1.4fr 1fr 1fr 1fr 1.4fr; } }
  .foot-brand { grid-column: 1 / -1; display: grid; gap: 10px; align-content: start; }
  @media (min-width: 900px) { .foot-brand { grid-column: auto; } }
  .foot-brand .logo { color: var(--foot-ink); justify-self: start; }
  .foot-brand p { max-width: 28ch; }
  .foot-brand small { color: var(--foot-muted); font-size: 0.86rem; }
  .foot-col { display: grid; gap: 9px; align-content: start; min-width: 0; }
  .foot-col h3 { font-size: 0.98rem; margin-bottom: 4px; }
  .foot-col button, .foot-col a { justify-self: start; background: none; border: 0; padding: 0; color: var(--foot-muted); font-size: 0.94rem; cursor: pointer; text-decoration: none; text-align: left; }
  .foot-col button:hover, .foot-col a:hover { color: var(--foot-ink); }
  .foot-help { grid-column: 1 / -1; }
  @media (min-width: 900px) { .foot-help { grid-column: auto; } }
  .foot-help p { color: var(--foot-muted); font-size: 0.94rem; max-width: 34ch; }
  .foot-help a { color: var(--link); }
  .foot-bottom { border-top: 1px solid var(--foot-line); padding-top: 16px; display: flex; flex-wrap: wrap; gap: 10px 22px; justify-content: space-between; color: var(--foot-muted); font-size: 0.82rem; }
  .foot-bottom nav { display: flex; flex-wrap: wrap; gap: 6px 18px; }
  .foot-bottom a, .foot-bottom button { color: var(--foot-muted); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: none; font-size: 0.82rem; }
  .credit { flex-basis: 100%; font-size: 0.78rem; opacity: 0.85; }
  @media (prefers-reduced-motion: reduce) { details.cat > summary::after { transition: none; } }
  /* our additions: no inline styles, source line on call rows */
  .people-body { padding: 8px 16px 16px; gap: 10px; }
  .first-row .src { color: var(--muted); font-size: 0.78rem; }
  .first-row .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }

  /* ---------- pages (issue #71): one copy of each section; the router shows the ones marked data-pages ---------- */
  .row-head .more-link { flex: none; }

  /* ---------- three roles, one goal (issue #72, from #66): user · volunteer · admin, one line each ---------- */
  .roles { border: 1px solid var(--line); border-radius: 22px; background: var(--surface); overflow: hidden; }
  .roles-top { display: grid; gap: 16px; padding: 24px; align-items: center; background: radial-gradient(60% 120% at 100% 0%, var(--glow), transparent 70%); }
  @media (min-width: 760px) { .roles-top { grid-template-columns: minmax(0, 1fr) auto; } }
  .roles-head { display: grid; gap: 8px; justify-items: start; }
  .roles-top h2 { font-size: clamp(1.4rem, 3.6vw, 1.9rem); }
  .roles-top h2 .soft { display: block; color: var(--muted); }
  .roles-top p { color: var(--ink-2); max-width: 54ch; }
  .roles-top .btn { min-height: 44px; padding-inline: 22px; justify-self: start; }
  .roles-grid { display: grid; grid-template-columns: minmax(0, 1fr); border-top: 1px solid var(--line); }
  @media (min-width: 760px) { .roles-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .role { padding: 18px 24px; display: grid; gap: 8px; align-content: start; border-bottom: 1px solid var(--line); min-width: 0; }
  .role:last-child { border-bottom: 0; }
  @media (min-width: 760px) { .role { border-bottom: 0; border-right: 1px solid var(--line); } .role:last-child { border-right: 0; } }
  .role h3 { font-size: 1.02rem; display: flex; align-items: center; gap: 10px; }
  .role .ico { width: 36px; height: 36px; flex: none; border-radius: 11px; display: grid; place-items: center; background: var(--surface-2); color: var(--accent); }
  .role .ico svg { width: 18px; height: 18px; }
  .role p { color: var(--muted); font-size: 0.92rem; }
  .role .tag { justify-self: start; }
  .roles-note { padding: 14px 24px; border-top: 1px solid var(--line); color: var(--ink-2); font-size: 0.9rem; }
  .roles-note b { color: var(--ink); margin-right: 6px; }
  .more-link { justify-self: start; color: var(--link); font-weight: 700; text-decoration: none; }
  .more-link:hover { text-decoration: underline; }
  .more-link::after { content: " →"; content: " →" / ""; }
  .section-title .more-link { justify-self: center; }
  .faq-head { display: grid; gap: 10px; align-content: start; }
  /* Home shows a short preview; the full list is on its own page. */
  main[data-page="home"] #points > :nth-child(n+3),
  main[data-page="home"] #faqList > :nth-child(n+3),
  main[data-page="home"] #guideCards > :nth-child(n+3) { display: none; }
  /* Soft fade when a page opens; none for people who ask for less motion. */
  @media (prefers-reduced-motion: no-preference) {
    .page-in { animation: page-in var(--fade) ease-out; }
    @keyframes page-in { from { opacity: 0; } }
  }

</style>
</head>
<body>
<header class="site">
  <div class="wrap bar1">
    <button class="logo" id="homeBtn" type="button">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z"/></svg></span>
      <span class="logo-text">SafeConnect</span>
    </button>
    <div class="top-actions">
      <a class="hpill h999" id="h999" href="tel:999"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25c1.1.37 2.3.57 3.6.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg><span id="h999Text">৯৯৯</span></a>
      <button class="hpill acct" id="acctBtn" type="button" aria-label="Sign in"></button>
      <button class="hpill cta" id="ctaSend" type="button"></button>
      <button class="hpill lang" id="langBtn" type="button" aria-label="Language: English / বাংলা">EN</button>
      <button class="hpill round" id="themeBtn" type="button" aria-label="Night or day"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/></svg></button>
    </div>
    <!-- Shown in the middle by CSS order; placed last so 999 is the first control after the logo. -->
    <button class="areachip" id="areaChip" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z"/></svg>
      <span><b id="areaChipT"></b><small id="areaChipS"></small></span>
      <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="m7 10 5 5 5-5z"/></svg>
    </button>
  </div>
  <div class="wrap bar2">
    <nav class="tabs" id="nav" aria-label="Main"></nav>
    <button class="hfinder" id="hFinder" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.8 4.8-1.4 1.4-4.8-4.8A7.5 7.5 0 1 1 10.5 3Zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11Z"/></svg>
      <span id="hFinderText"></span>
    </button>
  </div>
</header>

<main id="main">
  <div class="wrap offline-wrap" id="offlineNote" hidden><p class="offline-note" id="offlineText" role="status"></p></div>
  <!-- HOME -->
  <div id="home">
    <!-- v3 home (issue #72): the feed comes first in the page, so 999 is reached first; on wide screens the sidebar sits on the left. -->
    <div class="wrap shell">
      <div class="feed">
        <section class="hero" aria-labelledby="hello" data-pages="home">
          <div class="hero-text">
            <p class="greet" id="greet"></p>
            <h1 id="hello" tabindex="-1"><span id="hello1"></span><span class="grad" id="hello2"></span></h1>
            <p class="lead" id="lead"></p>
            <p class="coverage" id="coverage"></p>
            <div class="actions">
              <a class="act glass red" id="call999" href="tel:999">
                <span class="tile"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25c1.1.37 2.3.57 3.6.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg></span>
                <span><strong id="call999Title"></strong><small id="call999Sub"></small></span>
                <span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M13.2 5.3 20 12l-6.8 6.7-1.4-1.4 4.3-4.3H4v-2h12.1l-4.3-4.3z"/></svg></span>
              </a>
              <button class="act glass violet" id="sosBtn" type="button">
                <span class="tile"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M2.5 11.2 20.6 3.4c.8-.34 1.6.46 1.26 1.26L14.1 22.8c-.37.86-1.62.78-1.87-.12l-1.9-6.98-6.98-1.9c-.9-.25-.98-1.5-.12-1.87Zm8.7 3.2 1.3 4.8 5.5-12.8-6.8 8Zm-1.2-1.2 8-6.8-12.8 5.5 4.8 1.3Z"/></svg></span>
                <span><strong id="sosBtnTitle"></strong><small id="sosBtnSub"></small></span>
                <span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M13.2 5.3 20 12l-6.8 6.7-1.4-1.4 4.3-4.3H4v-2h12.1l-4.3-4.3z"/></svg></span>
              </button>
              <button class="act glass amber" id="locateBtn" type="button">
                <span class="tile"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z"/></svg></span>
                <span><strong id="locateTitle"></strong><small id="locateSub"></small></span>
                <span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M13.2 5.3 20 12l-6.8 6.7-1.4-1.4 4.3-4.3H4v-2h12.1l-4.3-4.3z"/></svg></span>
              </button>
            </div>
            <ul class="trust" id="trust"></ul>
            <section class="welcome" id="welcome" hidden aria-labelledby="welcomeTitle"></section>
            <div class="home-msgs" id="homeMsgs"><p class="msg" id="locMsg" role="status" hidden></p><div class="demo" id="demo" hidden><p id="demoText"></p><div class="chips" id="demoChips"></div></div></div>
          </div>
        </section>

        <!-- My area (issue #105): "Call these first" for the last area, and the opt-in auto location switch; filled by js/preview.js. -->
        <section class="row-sec myarea" id="myArea" aria-labelledby="myAreaTitle" data-pages="home"></section>

        <section class="row-sec icons" aria-labelledby="numbersTitle" data-pages="home numbers">
          <div class="row-head">
            <h1 class="page-title" id="numbersTitle" tabindex="-1" data-pages="numbers"></h1>
            <h2 id="numRowTitle" data-pages="home"></h2>
          </div>
          <div class="icon-row" id="iconRow"></div>
          <details class="cat icon-src" id="iconSrc" hidden>
            <summary><span id="iconSrcTitle"></span></summary>
            <div class="cat-body" id="iconSrcList"></div>
          </details>
        </section>

        <section class="row-sec findcard" id="findSec" aria-labelledby="findTitle" data-pages="home area">
          <div class="search-band">
            <div>
              <div class="intro"><h2 id="findTitle" tabindex="-1"></h2><p id="findText"></p></div>
              <div class="finder">
                <label class="searchbar" for="areaInput">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.8 4.8-1.4 1.4-4.8-4.8A7.5 7.5 0 1 1 10.5 3Zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11Z"/></svg>
                  <span id="areaLabel" hidden></span>
                  <input id="areaInput" type="search" autocomplete="off" aria-describedby="areaHint" aria-controls="suggest">
                  <select id="distSel" aria-label="District"></select>
                </label>
                <p class="hint" id="areaHint"></p>
                <ul class="suggest" id="suggest" hidden aria-live="polite"></ul>
                <button class="btn recent" id="recentBtn" type="button" hidden></button>
              </div>
              <p id="orText" hidden></p>
            </div>
            <svg class="find-art" viewBox="0 0 240 200" aria-hidden="true">
              <rect class="map" x="20" y="40" width="200" height="140" rx="18"/>
              <path class="road" d="M30 150 C80 120 110 160 150 120 S200 80 212 60"/>
              <path class="road" d="M60 50 C70 90 120 100 130 180"/>
              <path class="pin" d="M150 20c19 0 34 15 34 33 0 25-34 61-34 61s-34-36-34-61c0-18 15-33 34-33Zm0 20a13 13 0 1 0 0 26 13 13 0 0 0 0-26Z"/>
              <circle class="pin2" cx="70" cy="140" r="9"/>
            </svg>
          </div>
        </section>

        <section class="row-sec" aria-labelledby="quickTitle" data-pages="home area">
          <div class="row-head"><div><p class="eyebrow" id="quickEyebrow" hidden></p><h2 id="quickTitle"></h2><p class="soft" id="quickText"></p></div></div>
          <div class="places" id="places"></div>
          <div class="stats glass" id="stats"></div>
        </section>

        <section class="row-sec" aria-labelledby="guideTitle" data-pages="home guide">
          <div class="row-head"><div><h2 id="guideTitle" tabindex="-1"></h2><p class="soft" id="guideText"></p></div><a class="more-link" id="guideMore" href="#/guide" data-pages="home"></a></div>
          <div class="grid-3" id="guideCards"></div>
        </section>

        <section class="row-sec" aria-label="Prepare" data-pages="guide">
          <div class="duo" id="duoCards"></div>
        </section>

        <!-- About and questions have their own pages (#108): home only links to them. -->
        <nav class="morelinks" id="moreLinks" aria-label="More" data-pages="home"></nav>
      </div>

      <!-- Sidebar: on wide screens on the left (CSS), on phones under the feed. -->
      <aside class="rail" id="rail" data-pages="home">
        <!-- Emergency help (issue #103): only on wide screens, where the feed's big buttons scroll away. -->
        <section class="helpcard" aria-labelledby="hcTitle">
          <h2 id="hcTitle"></h2>
          <a class="hc-btn red" id="hc999" href="tel:999">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25c1.1.37 2.3.57 3.6.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
            <span id="hc999T"></span>
          </a>
          <button class="hc-btn" id="hcSend" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M2.5 11.2 20.6 3.4c.8-.34 1.6.46 1.26 1.26L14.1 22.8c-.37.86-1.62.78-1.87-.12l-1.9-6.98-6.98-1.9c-.9-.25-.98-1.5-.12-1.87Zm8.7 3.2 1.3 4.8 5.5-12.8-6.8 8Zm-1.2-1.2 8-6.8-12.8 5.5 4.8 1.3Z"/></svg>
            <span id="hcSendT"></span>
          </button>
          <button class="hc-btn" id="hcNear" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z"/></svg>
            <span id="hcNearT"></span>
          </button>
          <button class="hc-btn" id="hcArea" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3 2 12h3v8h6v-6h2v6h6v-8h3z"/></svg>
            <span><b id="hcAreaT"></b><small id="hcAreaS"></small></span>
          </button>
        </section>
        <section class="filter" aria-labelledby="fTitle">
          <h2 id="fTitle"></h2>
          <label class="field"><span id="fDist"></span><select id="railDist"></select></label>
          <p class="fnote" id="fNote"></p>
          <button class="linkbtn" id="fReset" type="button"></button>
        </section>
        <section class="appcard" aria-labelledby="appTitle">
          <span class="app-ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M7 2h10a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Zm0 3v13h10V5H7Zm5 14.2a1 1 0 1 0 0 2 1 1 0 0 0 0-2Z"/></svg></span>
          <b id="appTitle"></b>
          <small id="appText"></small>
          <a class="app-url" id="appUrl" href="https://jerin101.github.io/safe-connect/">jerin101.github.io/safe-connect</a>
        </section>
      </aside>
    </div>

    <section class="section" id="rolesSec" aria-labelledby="rolesTitle" data-pages="home">
      <div class="wrap"><div class="roles">
        <div class="roles-top">
          <div class="roles-head"><p class="eyebrow" id="rolesEyebrow"></p><h2 id="rolesTitle"><span id="rolesT1"></span><span class="soft" id="rolesT2"></span></h2><p id="rolesText"></p></div>
          <button class="btn violet" id="rolesSignin" type="button"></button>
        </div>
        <div class="roles-grid" id="rolesGrid"></div>
        <p class="roles-note" id="rolesNote"></p>
      </div></div>
    </section>

    <section class="section tint" id="about" aria-labelledby="aboutTitle" data-pages="about">
      <div class="wrap about">
        <div class="intro"><p class="eyebrow" id="aboutEyebrow"></p><h2 id="aboutTitle" tabindex="-1"></h2><p id="aboutText"></p><a class="more-link" id="aboutMore" href="#/about" data-pages="home"></a></div>
        <div class="points" id="points"></div>
      </div>
    </section>

    <section class="section" aria-labelledby="helpTitle" data-pages="faq">
      <div class="wrap">
        <div class="section-title"><h2 id="helpTitle"></h2></div>
        <div class="help-row" id="helpRow"></div>
      </div>
    </section>

    <section class="feature" aria-labelledby="netTitle" data-pages="about">
      <div class="scene" aria-hidden="true">
        <div class="stars"></div><div class="orb"></div>
        <svg class="hills" viewBox="0 0 1200 200" preserveAspectRatio="none">
          <path class="h1" d="M0 120 C150 60 260 90 380 70 C520 45 600 110 760 80 C900 55 1010 30 1200 75 L1200 200 L0 200 Z"/>
          <path class="h2" d="M0 160 C180 120 300 150 460 130 C640 108 760 160 920 140 C1040 125 1120 120 1200 130 L1200 200 L0 200 Z"/>
        </svg>
      </div>
      <div class="wrap">
        <div class="feature-box"><h2 id="netTitle"></h2><ul class="ticks" id="netList"></ul></div>
      </div>
    </section>

    <section class="section tint" id="faq" aria-labelledby="faqTitle" data-pages="faq">
      <div class="wrap faq">
        <div class="faq-head"><p class="eyebrow" id="faqEyebrow"></p><h2 id="faqTitle" tabindex="-1"></h2><a class="more-link" id="faqMore" href="#/faq" data-pages="home"></a></div>
        <div class="faq-list" id="faqList"></div>
      </div>
    </section>
  </div>

  <!-- AREA -->
  <div class="wrap page" id="area" hidden>
    <div class="page-top"><button class="back" id="backBtn" type="button"></button></div>
    <section class="here glass" aria-labelledby="placeName">
      <p class="label" id="youAreIn"></p>
      <h1 id="placeName" tabindex="-1"></h1>
      <p class="sub" id="placeSub"></p>
      <div class="here-row"><button class="btn" id="changeBtn" type="button"></button></div>
    </section>
    <section class="share glass" id="share" hidden aria-labelledby="shareTitle">
      <h2 id="shareTitle"></h2>
      <p id="shareText"></p>
      <div class="chips" id="shareBtns"></div>
    </section>
    <p class="msg plain" id="outside" hidden></p>
    <p class="note" id="placeNote" hidden></p>
    <section class="first" aria-labelledby="firstTitle">
      <h2 id="firstTitle"></h2>
      <p class="calm" id="firstCalm"></p>
      <div class="first" id="firstList"></div>
    </section>
    <!-- Auto location is on and this is not the person's own area; under the call list so it never pushes the numbers down (#99, after #105). -->
    <div class="note auto-note" id="autoNote" hidden><p id="autoNoteText"></p><button class="linkbtn" id="autoNoteBtn" type="button"></button></div>
    <section class="more" aria-labelledby="moreTitle" id="moreSec">
      <h2 id="moreTitle"></h2>
      <div class="more" id="moreList"></div>
    </section>
  </div>

  <!-- SEND LOCATION -->
  <div class="wrap page" id="sos" hidden>
    <div class="page-top">
      <button class="back" id="sosBack" type="button"></button>
      <h1 class="page-title" id="sosTitle" tabindex="-1"></h1>
    </div>
    <section class="panel glass" aria-labelledby="sitTitle">
      <h2 id="sitTitle"></h2>
      <div class="chips" id="situations"></div>
    </section>
    <section class="panel glass" aria-labelledby="locTitle">
      <h2 id="locTitle"></h2>
      <p class="locline" id="sosLoc" role="status"></p>
      <button class="btn violet locbtn" id="sosLocBtn" type="button" hidden></button>
      <div class="demo" id="sosDemo" hidden><p id="sosDemoText"></p><div class="chips" id="sosDemoChips"></div></div>
    </section>
    <section class="panel glass" aria-labelledby="sendTitle">
      <h2 id="sendTitle"></h2>
      <div id="sendList"></div>
      <div class="tools" id="sendTools"></div>
      <div class="send-note" id="sendNote" role="status" aria-live="polite"></div>
      <p class="privacy" id="msgrHint" hidden></p>
      <p class="privacy" id="smsHint"></p>
    </section>
    <section class="panel glass" aria-labelledby="msgTitle">
      <label for="sosMsg"><h2 id="msgTitle"></h2></label>
      <textarea id="sosMsg" rows="4"></textarea>
    </section>
    <details class="cat" id="peopleBox">
      <summary><span id="peopleTitle"></span><span class="count" id="peopleCount"></span></summary>
      <div class="cat-body people-body">
        <div id="savedList"></div>
        <form class="form" id="addForm" novalidate>
          <div class="row">
            <label><span id="lblName"></span><input id="pName" type="text" autocomplete="off" maxlength="40"></label>
            <label><span id="lblRel"></span><input id="pRel" type="text" autocomplete="off" maxlength="20"></label>
          </div>
          <label><span id="lblPhone"></span><input id="pPhone" type="tel" inputmode="tel" autocomplete="off" maxlength="20"></label>
          <p class="err" id="formErr" hidden></p>
          <button class="send" id="saveBtn" type="submit"></button>
        </form>
        <p class="privacy" id="privacy"></p>
      </div>
    </details>
  </div>

  <!-- ACCOUNT PAGE (#/account, issue #73): opening the address never loads Firebase; a tap on the button does. -->
  <div class="wrap page" id="acct" hidden>
    <div class="si-head"><p class="eyebrow" id="acctEyebrow"></p><h1 id="acctTitle" tabindex="-1"></h1></div>
    <p id="acctText"></p>
    <p class="offline-note" id="acctOffline" role="status" hidden></p>
    <p class="msg" id="acctMsg" role="alert" hidden></p>
    <div><button class="btn violet" id="acctGo" type="button"></button></div>
  </div>

  <!-- SIGN IN (P45, issue #73): a modal over the current page. 999 comes first, then help without signing in, then the options. Built by js/auth.js. -->
  <dialog class="simodal" id="signin" aria-labelledby="siTitle">
    <div class="mbar">
      <a class="hpill h999" id="si999" href="tel:999"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25c1.1.37 2.3.57 3.6.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg><span id="si999Text"></span></a>
      <button class="mclose" id="siClose" type="button" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6 10.6 12 5 6.4Z"/></svg></button>
    </div>
    <div class="mcard">
      <div class="mleft">
        <section class="nologin" aria-labelledby="noLoginTitle">
          <b id="noLoginTitle"></b><p id="noLoginText"></p>
          <div class="nologin-btns" id="noLoginBtns"></div>
        </section>
        <section class="adds" aria-labelledby="addsTitle">
          <h2 id="addsTitle"></h2>
          <ul id="addsList"></ul>
          <small id="addsSoon"></small>
        </section>
      </div>
      <div class="mright">
        <div class="si-head"><p class="eyebrow" id="siEyebrow"></p><h1 id="siTitle" tabindex="-1"><span id="siT1"></span><span class="soft" id="siT2"></span></h1></div>
        <div class="role-pick" id="rolePick" role="radiogroup"></div>
        <form class="si-form" id="siForm" novalidate>
          <h2 id="siFormTitle"></h2>
          <p class="offline-note" id="siOffline" role="status" hidden></p>
          <!-- The official Google "G" (docs/DESIGN.md §4): inline, never recoloured or stretched. -->
          <button class="gbtn" id="siGoogle" type="button">
            <svg class="g-logo" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
            <span id="siGoogleText"></span>
          </button>
          <p class="msg" id="siGMsg" role="alert" hidden></p>
          <p class="or" id="siOr"></p>
          <label class="field"><span id="siEmailL"></span><input id="siEmail" type="email" autocomplete="email" placeholder="you@example.com"></label>
          <label class="field"><span id="siPassL"></span><input id="siPass" type="password" autocomplete="current-password"></label>
          <p class="msg" id="siMsg" role="alert" hidden></p>
          <button class="btn violet wide" id="siSubmit" type="submit"></button>
          <div class="si-links"><button class="linkbtn" id="siCreate" type="button"></button><button class="linkbtn" id="siForgot" type="button"></button></div>
          <p class="si-note" id="siNote"></p>
          <div id="siExtra"></div>
        </form>
      </div>
    </div>
  </dialog>

  <!-- REPORT A WRONG NUMBER (P18, issue #79): 3 steps over the area page. 999 comes first. Built by js/reports.js. -->
  <dialog class="simodal rmodal" id="repDialog" aria-labelledby="repTitle">
    <div class="mbar">
      <a class="hpill h999" href="tel:999"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25c1.1.37 2.3.57 3.6.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg><span id="rep999Text"></span></a>
      <button class="mclose" id="repClose" type="button" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6 10.6 12 5 6.4Z"/></svg></button>
    </div>
    <div class="rep-body">
      <div class="si-head"><p class="eyebrow" id="repEyebrow"></p><h1 id="repTitle" tabindex="-1"></h1><p id="repLead"></p></div>
      <ol class="stepper" id="repSteps"></ol>
      <div class="rep-step" id="repStep"></div>
    </div>
  </dialog>

  <!-- WORKSPACE (P35, issue #78): built by js/workspace.js. The main part comes first in the page (999 in the header stays
       the first control); on wide screens CSS puts the sidebar on the left. On phones: the section bar and sign-out at the top. -->
  <div class="wrap ws" id="ws" hidden>
    <div class="ws-main">
      <nav class="mobnav" id="wsMob" aria-label="Sections"></nav>
      <div class="ws-bar"><span id="wsCrumb"></span><button class="btn sm mob-out" id="wsOut" type="button"></button></div>
      <div class="page-head"><p class="eyebrow" id="wsEyebrow"></p><h1 id="wsTitle" tabindex="-1"></h1><p id="wsLead"></p></div>
      <p class="si-note" id="wsNote" role="status" hidden></p>
      <p class="ws-who" id="wsWho" hidden></p>
      <div class="ws-body" id="wsBody"></div>
    </div>
    <aside class="side" id="wsSide" aria-label="Workspace"></aside>
  </div>

  <dialog class="confirm" id="outDialog" aria-labelledby="outTitle" aria-describedby="outText">
    <form method="dialog">
      <h2 id="outTitle"></h2>
      <p id="outText"></p>
      <label class="check"><input type="checkbox" id="outRemove"><span id="outRemoveText"></span></label>
      <p class="si-note" id="outSync" hidden></p>
      <div class="confirm-row"><button class="btn" id="outNo" value="cancel"></button><button class="btn violet" id="outYes" value="yes"></button></div>
    </form>
  </dialog>
  <p class="toast" id="toast" role="status" hidden></p>
</main>

<footer>
  <div class="wrap">
    <div class="foot-grid" id="footGrid"></div>
    <div class="foot-bottom" id="footBottom"></div>
  </div>
</footer>

<script type="module" src="js/preview.js"></script>
</body>
</html>
