# Serves the SafeConnect website (the src/ folder) inside the Docker image.
# Plain static files, no build step. Same behaviour as GitHub Pages, plus the cache rules the offline app needs.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # The service worker and the pages must never be cached by the browser, or phones would not see a new VERSION.
  location = /service-worker.js { add_header Cache-Control "no-cache"; }
  location = /index.html        { add_header Cache-Control "no-cache"; }
  location = /manifest.json     { add_header Cache-Control "no-cache"; default_type application/manifest+json; }

  # Fonts and icons never change under the same name.
  location ~* \.(woff2|png|svg)$ { add_header Cache-Control "public, max-age=31536000, immutable"; }

  location / { try_files $uri $uri/ =404; }
}
